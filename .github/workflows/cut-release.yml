name: Cut Release Branch

# The only sanctioned way to publish a release. Patch, minor, and major all go through this same
# workflow -- the only difference is which version component bump_type increments. Defaults to
# patch, the routine case: develop's current accumulated state becomes the next patch release
# as-is. backport-hotfix.yml is a separate, narrower mechanism for patching a line develop has
# already moved past (minor/major bumped beyond it) -- this workflow always cuts from develop's
# current tip.
#
# What it does, in order:
#   1. Reads develop's current X.Y.Z-SNAPSHOT version.
#   2. Branches release/vX.Y.Z from develop at the version bump_type computes (see below) and sets
#      that branch's version to the released version, then explicitly dispatches
#      publish-release-branch.yml -- pushing the branch alone does not trigger it, since this job's
#      GITHUB_TOKEN-authenticated push doesn't fire other workflows' `push` triggers.
#   3. Stamps that release branch's LICENSE (Business Source License 1.1) Change Date to exactly
#      four years from today. Each release line gets its own BSL clock, set once at cut time and
#      never touched again -- see backport-hotfix.yml for the only sanctioned way anything else
#      lands on this branch.
#   4. Bumps develop to the next SNAPSHOT. A patch cut just increments develop's own patch number
#      (Z+1) -- there's no other line for it to collide with. A minor/major cut skips develop past
#      the line just cut (X.(Y+2).0-SNAPSHOT / X.(Y+1).1.0-SNAPSHOT), since that cut line now owns
#      its own patch sequence via backport-hotfix.yml, and develop must never also claim a version
#      in it.
#
# Worked examples, all starting from develop at 3.2.25-SNAPSHOT:
#   patch cut -> release/v3.2.25 (same version, just un-SNAPSHOT'd) -> develop 3.2.26-SNAPSHOT.
#   minor cut -> release/v3.3.0 -> develop 3.4.0-SNAPSHOT.
#   major cut -> release/v4.0.0 -> develop 4.1.0-SNAPSHOT.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Which version component to bump for this release'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write # to dispatch publish-release-branch.yml / publish-snapshot.yml below
  pull-requests: write # to open the develop version-bump PR below

jobs:
  cut-release:
    name: Cut release branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compute release and next-develop versions
        id: versions
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          CURRENT=$(mvn -q -pl . help:evaluate -Dexpression=project.version -DforceStdout)
          BASE="${CURRENT%-SNAPSHOT}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          case "$BUMP_TYPE" in
            major)
              RELEASE_VERSION="$((MAJOR + 1)).0.0"
              NEXT_DEVELOP="$((MAJOR + 1)).1.0-SNAPSHOT"
              ;;
            minor)
              RELEASE_VERSION="${MAJOR}.$((MINOR + 1)).0"
              NEXT_DEVELOP="${MAJOR}.$((MINOR + 2)).0-SNAPSHOT"
              ;;
            patch|"")
              # develop's current state becomes the release as-is; only what develop moves to
              # afterward increments.
              RELEASE_VERSION="$BASE"
              NEXT_DEVELOP="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
              ;;
            *)
              echo "::error::Unknown bump_type '$BUMP_TYPE' -- must be patch, minor, or major."
              exit 1
              ;;
          esac
          RELEASE_BRANCH="release/v${RELEASE_VERSION}"

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_develop=$NEXT_DEVELOP" >> "$GITHUB_OUTPUT"
          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

          echo "develop is at $CURRENT -- cutting $RELEASE_BRANCH (v$RELEASE_VERSION, bump_type=$BUMP_TYPE), develop moves to $NEXT_DEVELOP"

      - name: Fail fast if the release branch already exists
        run: |
          if git ls-remote --exit-code --heads origin "${{ steps.versions.outputs.release_branch }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.versions.outputs.release_branch }} already exists -- nothing to cut. If this is a re-run after a partial failure, delete or finish that branch first."
            exit 1
          fi

      - name: Create the release branch and set its version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.versions.outputs.release_branch }}"
          mvn -q -B versions:set -DnewVersion="${{ steps.versions.outputs.release_version }}" -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Stamp this release line's BSL Change Date (today + 4 years)
        run: |
          CHANGE_DATE=$(date -u -d "+4 years" +%F)
          if ! grep -q "^Change Date:" LICENSE; then
            echo "::error::LICENSE has no 'Change Date:' line to stamp -- has the license model changed? Update this step to match."
            exit 1
          fi
          sed -i -E "s/^Change Date:([[:space:]]*)[0-9]{4}-[0-9]{2}-[0-9]{2}/Change Date:\1${CHANGE_DATE}/" LICENSE
          echo "Change Date for ${{ steps.versions.outputs.release_branch }}: $CHANGE_DATE"
          grep "^Change Date:" LICENSE

      - name: Commit and push the release branch
        run: |
          git add -A
          git commit -m "Cut ${{ steps.versions.outputs.release_branch }} (v${{ steps.versions.outputs.release_version }})"
          git push origin "${{ steps.versions.outputs.release_branch }}"

      # GitHub does not start other workflows' `push` triggers from a push authenticated with this
      # job's own GITHUB_TOKEN (it only prevents the obvious infinite-recursion case, not cross-
      # workflow triggers in general) -- so publish-release-branch.yml's `on: push` never fires for
      # the branch just pushed above. Dispatch it explicitly instead.
      - name: Trigger publish-release-branch.yml for the new release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-release-branch.yml --ref "${{ steps.versions.outputs.release_branch }}"

      # Builds the bump commit with no admin credential anywhere in this step's environment --
      # ADMIN_BYPASS_TOKEN is scoped to the next step only, which does nothing but push/PR/merge,
      # so a compromised Maven plugin or build extension here has nothing to steal.
      - name: Compute the develop bump commit
        id: bump
        run: |
          BRANCH="chore/bump-develop-to-${{ steps.versions.outputs.next_develop }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          mvn -q -B versions:set -DnewVersion="${{ steps.versions.outputs.next_develop }}" -DprocessAllModules=true -DgenerateBackupPoms=false
          git add -A
          git commit -m "chore: bump develop to ${{ steps.versions.outputs.next_develop }} after cutting v${{ steps.versions.outputs.release_version }}"

      # develop is a protected branch requiring 6 status checks, enforced on direct pushes and PR
      # merges alike -- confirmed against two independent real failures: this step's own plain
      # `gh pr merge` ("GraphQL: 6 of 6 required status checks are expected") and
      # sync-cloudforge-manager-deployment-version.yml's direct push ("GH006: Protected branch
      # update failed"). enforce_admins is false on this branch, so an actual repo admin is exempt
      # -- but GITHUB_TOKEN never carries that role, no matter what scopes its `permissions:` block
      # grants, so nothing authenticated with it can ever merge here no matter how it's called.
      # ADMIN_BYPASS_TOKEN is a PAT from a real CloudForgeCI admin account, which is what actually
      # satisfies enforce_admins. Unlike GITHUB_TOKEN, a PAT-authenticated push/merge is not
      # exempted from starting other workflows, so this merge triggers publish-snapshot.yml's own
      # `push: branches: [develop]` trigger on its own -- no separate dispatch needed.
      - name: Push and merge the develop bump
        env:
          GH_TOKEN: ${{ secrets.ADMIN_BYPASS_TOKEN }}
        run: |
          BRANCH="${{ steps.bump.outputs.branch }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"
          gh pr create --base develop --head "$BRANCH" \
            --title "chore: bump develop to ${{ steps.versions.outputs.next_develop }}" \
            --body "Version bump following the v${{ steps.versions.outputs.release_version }} cut. Opened by cut-release.yml."
          # Merged immediately, not with --auto: a PR opened by this token still gets no real CI
          # status in time for an immediate merge attempt (the checks it eventually triggers
          # haven't run yet at this point), so --auto would wait forever on checks the merge itself
          # doesn't need to wait for. Fails loudly: the cut itself is already done, but a bump PR
          # left open would leave develop on the released version.
          if ! gh pr merge "$BRANCH" --squash --delete-branch --admin; then
            echo "::error::Opened the bump PR from $BRANCH but could not merge it. Merge it by hand so develop moves to ${{ steps.versions.outputs.next_develop }}."
            exit 1
          fi

      - name: Summary
        run: |
          echo "## Release Cut" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release branch:** ${{ steps.versions.outputs.release_branch }} (v${{ steps.versions.outputs.release_version }})" >> $GITHUB_STEP_SUMMARY
          echo "**Develop bumped to:** ${{ steps.versions.outputs.next_develop }}" >> $GITHUB_STEP_SUMMARY
          echo "**BSL Change Date (this release line only):** $(grep '^Change Date:' LICENSE | awk '{print $NF}')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "publish-release-branch.yml and publish-snapshot.yml were both dispatched explicitly (see above) since a GITHUB_TOKEN push doesn't trigger them on its own." >> $GITHUB_STEP_SUMMARY
