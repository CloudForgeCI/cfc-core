name: Publish Release Branch

# Publishes a real Maven Central release from a frozen release/vX.Y.Z branch. These branches are
# created only by cut-release.yml (cutting the next minor from develop on demand) and patched
# only by backport-hotfix.yml (the only sanctioned way anything lands on one after the cut) -- see
# those two workflows. develop itself only ever publishes snapshots; see publish-snapshot.yml.
#
# Every push to a release/v* branch builds, signs, and publishes the branch's current <version>
# -- which is always a real, non-SNAPSHOT version the moment the branch exists -- to Maven
# Central, guarded by the same already-tagged check publish-maven-central.yml used to have (so a
# re-run after a partial failure, or a push that didn't change <version>, is a safe no-op).
#
# No build-test gate here: a release branch's content was already built and tested on develop
# before cut-release.yml cut it, and release branches carry no required status checks of their
# own -- this workflow goes straight to publishing.
#
# cloudforge-ministack and cloudforge-localstack each have no cut-release step of their own -- this
# job is it, for both. Neither is a Maven dependency of cfc-core's own reactor (that compile-time
# coupling previously existed between cloudforge-api and both modules and caused a real,
# unresolvable circular-dependency race across the three repos' release cadences; it was removed --
# the local-emulator deploy dispatch that used it now lives in cloudforge-cli instead). cfc-core's
# only remaining relationship to either is this publish step: each one's own pom.xml says directly
# why its <version> and its <parent> version must be the exact same number as each other ("kept in
# lockstep with the parent's version... stays released alongside cfc-core on the same version
# number") -- cfc-core's own published BOM manages cloudforge-core's version as the literal string
# ${project.version}, which Central's flatten step leaves UNRESOLVED (verified live against the
# real 3.3.2 release's published pom); a consumer inheriting that entry resolves it against its OWN
# version, not the parent's. Setting them to two different numbers (this job's own develop version
# and cfc-core's previous release) broke exactly this way on a real v3.3.3 release attempt; not a
# hypothetical.
#
# This job builds each repo from its own develop tip with both its <version> and its <parent>
# version forced to THIS release's own version, and publishes it with these same secrets if that
# exact version isn't on Central yet. Checking first makes a re-run (after a partial failure, or a
# push that didn't change anything) a safe no-op, same as the already-tagged check above does for
# cfc-core's own version.
#
# Not published here (each is released from its own repository and cadence):
#   - cloudforge-synth-service: its only Maven consumer is cloudforge-manager's test scope, which
#     installs it from a sibling checkout.
#   - cloudforge-manager-deployment: declares cfc-core as its Maven <parent> (resolved from
#     Central), which lets it inherit this release profile while publishing independently.
#   - cloudforge-manager: standalone pom with no parent.
#
# Required repo secrets (none of these can be set by CI itself — add them under Settings →
# Secrets and variables → Actions before the publish job will do anything but skip):
#   GPG_PRIVATE_KEY          ASCII-armored private key, base64-encoded:
#                               gpg --armor --export-secret-keys <KEYID> | base64 -w0
#   GPG_PASSPHRASE            The key's passphrase.
#   CENTRAL_PORTAL_USERNAME   Central Portal "Generate User Token" username half — NOT your
#                             account login. https://central.sonatype.com/account
#   CENTRAL_PORTAL_PASSWORD   Same token's password half.

on:
  push:
    branches: [ 'release/v*' ]
    paths:
      - 'pom.xml'
      - 'cloudforge-core/**'
      - 'cloudforge-api/**'
      - '.github/workflows/publish-release-branch.yml'
  # cut-release.yml and backport-hotfix.yml both push to release/v* with their own GITHUB_TOKEN,
  # which does not fire the `push` trigger above (GitHub doesn't start workflows from
  # GITHUB_TOKEN-authenticated pushes) -- so both explicitly dispatch this workflow right after
  # pushing instead of relying on it.
  workflow_dispatch: {}

permissions:
  contents: write # to push the release tag on success

jobs:
  check-version:
    name: Check if this version needs publishing
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.decide.outputs.should_publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full tag history

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Read project version
        id: version
        run: |
          VERSION=$(mvn -q -pl . help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Root pom version: $VERSION"

      - name: Decide whether to publish
        id: decide
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::error::Version $VERSION is a SNAPSHOT -- a release/v* branch's pom.xml should always carry a real version from the moment cut-release.yml creates it. Something overwrote it."
            exit 1
          fi

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already tagged — nothing changed to publish."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is not yet tagged — will publish."
          fi

  publish:
    name: Build, sign, and publish
    # macOS, not Linux: on Linux runners (ubuntu-latest, ubuntu-22.04, Homebrew's GnuPG, and
    # containers, which share the host kernel) gpg-agent fails with "Too much data for IPC layer"
    # when signing, regardless of key, plugin version, or config. macOS runners are not affected.
    runs-on: macos-latest
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-release-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-release-
            ${{ runner.os }}-maven-

      - name: Install gnupg
        run: brew install gnupg

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          # --pinentry-mode loopback (in the release profile's gpg-plugin config) is ignored by
          # gpg-agent unless allow-loopback-pinentry is set here; without it, the agent tries to
          # launch a pinentry program and fails headless ("gpg: signing failed: No pinentry").
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          DECODED=$(echo "$GPG_PRIVATE_KEY_B64" | base64 -d)
          # ::add-mask:: only masks a single line -- mask every line of the multi-line
          # armor block individually, or everything after the first line prints in plain
          # text the moment it appears in any later log output.
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$DECODED"
          echo "$DECODED" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          # The release profile's maven-gpg-plugin config reads <homedir>${env.GPG_HOMEDIR}</homedir>,
          # not GNUPGHOME (the gpg CLI's own var) -- both must point at the same imported keyring.
          echo "GPG_HOMEDIR=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Configure Maven settings.xml (Central Portal credentials)
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          if [ -z "$CENTRAL_PORTAL_USERNAME" ] || [ -z "$CENTRAL_PORTAL_PASSWORD" ]; then
            echo "::error::CENTRAL_PORTAL_USERNAME/CENTRAL_PORTAL_PASSWORD secrets are not set."
            exit 1
          fi
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_PORTAL_USERNAME}</username>
                <password>${CENTRAL_PORTAL_PASSWORD}</password>
                <!-- Maven sends a server's credentials only to the origins of the repositories declared
                     with the same id, and "central" is Maven Central. List the Central Portal origin so
                     the credentials go to the snapshots repository and not to Maven Central. -->
                <repositoryOrigins>
                  <repositoryOrigin>https://central.sonatype.com</repositoryOrigin>
                </repositoryOrigins>
              </server>
            </servers>
          </settings>
          EOF

      # Central rejects a release artifact whose dependencyManagement pins a SNAPSHOT dependency
      # ("Dependency management dependencies to SNAPSHOT versions not allowed"), but the BOM's
      # cloudforge-manager-deployment.version property is always a SNAPSHOT by design — see that
      # property's own comment in pom.xml, kept current by sync-cloudforge-manager-deployment-
      # version.yml, which only ever tracks the latest *SNAPSHOT*. For this one real-release
      # publish, swap it to whatever cloudforge-manager-deployment last published as a real
      # release on Central instead (never committed -- versions:set-property only touches this
      # runner's own checkout, nothing on the release branch itself is edited).
      - name: Resolve cloudforge-manager-deployment.version to its latest real Central release
        run: |
          RELEASE=$(curl -fsSL "https://repo1.maven.org/maven2/com/cloudforgeci/cloudforge-manager-deployment/maven-metadata.xml" \
            | grep -o '<release>[^<]*</release>' | sed -E 's|</?release>||g')
          if [ -z "$RELEASE" ]; then
            echo "::error::Could not resolve cloudforge-manager-deployment's latest release from Central's maven-metadata.xml"
            exit 1
          fi
          echo "Pinning cloudforge-manager-deployment.version to $RELEASE for this release build (never committed)"
          mvn -q -B versions:set-property -Dproperty=cloudforge-manager-deployment.version \
            -DnewVersion="$RELEASE" -DgenerateBackupPoms=false

      # Warning only, never a failure: the pin above is always a real release, but the deployment
      # repo releases on every push to its develop, so its newest SNAPSHOT can be published while
      # that release is still in flight (a pipeline run queued or not yet synced to Central). When
      # that is the case this BOM pins the previous release, so say so in the run instead of
      # leaving it to be noticed after publishing.
      - name: Warn if a newer cloudforge-manager-deployment snapshot is ahead of the pinned release
        run: |
          PINNED=$(mvn -q -B help:evaluate -Dexpression=cloudforge-manager-deployment.version -DforceStdout)
          LATEST_SNAPSHOT=$(curl -fsSL "https://central.sonatype.com/repository/maven-snapshots/com/cloudforgeci/cloudforge-manager-deployment/maven-metadata.xml" \
            | grep -o '<version>[^<]*-SNAPSHOT</version>' | sed -E 's|</?version>||g' | sort -V | tail -1 || true)
          if [ -z "$LATEST_SNAPSHOT" ]; then
            echo "Could not read cloudforge-manager-deployment's snapshot metadata; skipping the freshness check."
            exit 0
          fi
          STRIPPED="${LATEST_SNAPSHOT%-SNAPSHOT}"
          if [ "$(printf '%s\n%s\n' "$PINNED" "$STRIPPED" | sort -V | tail -1)" != "$PINNED" ]; then
            MSG="This release pins cloudforge-manager-deployment $PINNED, but $LATEST_SNAPSHOT is already published. Its release may still be in flight; check its last pipeline run and Central's metadata before relying on this BOM."
            echo "::warning::$MSG"
            echo "### Warning: deployment pin may be stale" >> "$GITHUB_STEP_SUMMARY"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "cloudforge-manager-deployment pin $PINNED is current (latest snapshot $LATEST_SNAPSHOT)."
          fi

      # Same existence check the cloudforge-ministack/cloudforge-localstack loop below already
      # does, applied here too: this step's own tag check only tells us v$VERSION wasn't tagged
      # yet, which is also true the moment a partial failure happens AFTER this deploy succeeds but
      # BEFORE the tag gets pushed (exactly what happened publishing v3.3.9 -- cfc-core/
      # cloudforge-core/cloudforge-api deployed fine, the ministack/localstack loop below failed,
      # and the run stopped before reaching the tag step). Re-running the whole job without this
      # guard would try to redeploy an already-published, immutable version -- Central rejects that
      # outright -- before ever reaching the modules that actually still need publishing.
      - name: Check whether cfc-core is already on Central
        id: cfc-core-check
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --retry 2 --retry-delay 5 \
            "https://repo1.maven.org/maven2/com/cloudforgeci/cfc-core/$VERSION/cfc-core-$VERSION.pom")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "cfc-core $VERSION is already on Central -- nothing to publish."
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$HTTP_CODE" != "404" ]; then
            echo "::error::Checking whether cfc-core $VERSION is already on Central returned HTTP $HTTP_CODE, not 200 or 404 -- not safe to decide whether to publish."
            exit 1
          else
            echo "cfc-core $VERSION is not on Central yet -- publishing it as part of this release."
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, sign, and publish cfc-core + cloudforge-core + cloudforge-api
        if: steps.cfc-core-check.outputs.needs_publish == 'true'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "Publishing cfc-core (root/BOM pom) + cloudforge-core + cloudforge-api..."
          mvn -B -Prelease -pl .,cloudforge-core,cloudforge-api -am clean deploy -DskipTests "-Dgpg.passphrase=$MAVEN_GPG_PASSPHRASE"

      # Diagnostic only, no fix attached to it: a local reproduction of this exact build produced
      # a structurally complete bundle (every component's .pom present, correctly placed), so
      # either the real runner's bundle differs from that reproduction in some way not yet
      # identified, or the defect is server-side. Uploading the actual bytes sent to Central --
      # not a reproduction -- is what settles which. Runs even when the step above fails: the
      # bundle is written to disk before the upload-to-Central call, regardless of whether Central
      # then accepts it.
      - name: Upload the exact bundle sent to Central, for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle-${{ needs.check-version.outputs.version }}
          path: target/central-publishing/central-bundle.zip
          retention-days: 7
          if-no-files-found: warn

      - name: Check out cloudforge-ministack's develop
        uses: actions/checkout@v7
        with:
          repository: CloudForgeCI/cloudforge-ministack
          ref: develop
          path: cloudforge-ministack

      - name: Check out cloudforge-localstack's develop
        uses: actions/checkout@v7
        with:
          repository: CloudForgeCI/cloudforge-localstack
          ref: develop
          path: cloudforge-localstack

      # Must run after cfc-core's own deploy above: each module's <version> AND <parent> version are
      # both forced to THIS release's own version (see this file's header for why they have to be the
      # exact same number), which doesn't exist anywhere -- not even in this runner's local .m2 -- until
      # that step has actually run.
      - name: Publish cloudforge-ministack and cloudforge-localstack if this release's version isn't on Central yet
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          RELEASE_VERSION="${{ needs.check-version.outputs.version }}"

          for module in cloudforge-ministack cloudforge-localstack; do
            # Only a confirmed 404 means "safe to publish"; a transient network error, a timeout, or a
            # non-200/404 response from Central must not be read as absence -- that would risk a bad
            # double-publish decision instead of just failing loudly so a human looks at it.
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --retry 2 --retry-delay 5 \
              "https://repo1.maven.org/maven2/com/cloudforgeci/$module/$RELEASE_VERSION/$module-$RELEASE_VERSION.pom")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "$module $RELEASE_VERSION is already on Central -- nothing to publish."
            elif [ "$HTTP_CODE" != "404" ]; then
              echo "::error::Checking whether $module $RELEASE_VERSION is already on Central returned HTTP $HTTP_CODE, not 200 or 404 -- not safe to decide whether to publish."
              exit 1
            else
              echo "$module $RELEASE_VERSION is not on Central yet -- publishing it as part of this release."
              mvn -q -B -f "$module/pom.xml" versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
              # versions:update-parent silently no-ops on an exact -DparentVersion here (verified
              # live, against both a lower and an equal real release) rather than forcing it, so the
              # parent's <version> is edited directly instead. Must equal the module's own version
              # just set above -- see this file's header for why.
              python3 -c "
              import re
              p = '$module/pom.xml'
              s = open(p).read()
              new = re.sub(
                  r'(<parent>.*?<artifactId>cfc-core</artifactId>\s*\n\s*(?:<!--.*?-->\s*\n\s*)?<version>)[^<]+(</version>)',
                  r'\g<1>$RELEASE_VERSION\g<2>', s, count=1, flags=re.S)
              assert new != s, 'parent version pattern did not match in ' + p
              open(p, 'w').write(new)
              "
              # The release profile's central-publishing-maven-plugin blocks this deploy call until
              # Central's own validation finishes (waitUntil=validated), not until the artifact is
              # fully searchable/downloadable on Central's CDN -- that part can still lag by minutes,
              # same as it can for cfc-core's own artifacts just published above (see this job's
              # closing summary step).
              mvn -B -Prelease -f "$module/pom.xml" clean deploy -DskipTests "-Dgpg.passphrase=$MAVEN_GPG_PASSPHRASE"
            fi
          done

      - name: Clean up credentials
        if: always()
        run: |
          rm -f ~/.m2/settings.xml
          rm -rf "${GNUPGHOME:-$RUNNER_TEMP/gnupg}"

      - name: Tag the published release
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Publish v$VERSION to Maven Central (cfc-core, cloudforge-core, cloudforge-api)"
          git push origin "v$VERSION"

      - name: Publish summary
        if: always()
        run: |
          echo "## Maven Central Publish" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.check-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Modules:** cfc-core (BOM), cloudforge-core, cloudforge-api" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Central Portal validates and auto-publishes asynchronously — check https://central.sonatype.com/publishing/deployments for final status; artifacts typically become searchable on Central within 15-30 minutes of a successful upload." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "cloudforge-ministack and cloudforge-localstack were each published at ${{ needs.check-version.outputs.version }} above if they weren't there already. cfc-core's own BOM has no dependency on either, so there's nothing to pin here -- their own repos' sync-cfc-core-version.yml keeps each one's <parent> on cfc-core's latest real release independently." >> $GITHUB_STEP_SUMMARY
