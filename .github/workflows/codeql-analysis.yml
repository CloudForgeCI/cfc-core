name: CodeQL Analysis

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  schedule:
    # Run CodeQL scans weekly on Mondays at 3 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Java Code
    # Dependabot's own PRs run on the org's self-hosted mac-mini runner instead of the shared
    # GitHub-hosted pool -- a dependabot PR only ever contains a dependency-manifest bump it
    # generated itself, lower-risk than an arbitrary human or fork PR, and routing that volume off
    # the shared pool is the whole point (it was the single biggest source of queued jobs). Needs
    # Maven + JDK 25 on the runner; both are installed there.
    runs-on: ${{ github.actor == 'dependabot[bot]' && fromJSON('["self-hosted", "mac-mini"]') || 'ubuntu-latest' }}
    timeout-minutes: 360

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # python: validation/scripts/*.py and the compliance tooling shell out, read deployment
        # context JSON, and build CLI arguments from it -- real injection/path-traversal surface,
        # not just the Java reactor.
        language: [ 'java-kotlin', 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Build with Maven
        run: |
          echo "Building project for CodeQL analysis..."
          mvn clean install -DskipTests -B -V
          echo "Build complete"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
