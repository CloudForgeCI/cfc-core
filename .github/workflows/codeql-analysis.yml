name: CodeQL Analysis

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  schedule:
    # Run CodeQL scans weekly on Mondays at 3 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Java Code
    # Stays on GitHub's own runners for every actor, including Dependabot -- the self-hosted
    # mac-mini runner (ARM64 macOS) crashes codeql-action's and actions/checkout's post-job
    # cleanup steps with "spawn Unknown system error -86" (EBADARCH), an architecture mismatch
    # specific to running CodeQL there. Build & test / Code Quality & Linting / SBOM Generation
    # route dependabot PRs to that runner just fine (see security-scan.yml/publish-snapshot.yml);
    # CodeQL just doesn't work there.
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # python: validation/scripts/*.py and the compliance tooling shell out, read deployment
        # context JSON, and build CLI arguments from it -- real injection/path-traversal surface,
        # not just the Java reactor.
        language: [ 'java-kotlin', 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Build with Maven
        run: |
          echo "Building project for CodeQL analysis..."
          mvn clean install -DskipTests -B -V
          echo "Build complete"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
