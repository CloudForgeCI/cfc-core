name: Deployment Testing & Metrics

on:
  schedule:
    # Hourly: Quick synthesis test
    - cron: '15 * * * *'  # Every hour at :15
    # Every 6 hours: Enhanced synthesis test
    - cron: '30 */6 * * *'  # Every 6 hours at :30
    # Daily at 3am UTC: Deployment dry-run with metrics
    - cron: '0 3 * * *'  # Daily at 3am UTC
    # Weekly on Sunday at 3am UTC: Full resource validation
    - cron: '0 3 * * 0'  # Every Sunday at 3am UTC

  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - enhanced
          - dry_run
          - changeset_validation
          - full_validation

  push:
    branches:
      - develop
      - main
    paths:
      - 'cloudforge-api/src/main/java/**'
      - 'cfc-testing/**'
      - 'pom.xml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  determine-test-type:
    name: Determine Test Type
    runs-on: ubuntu-latest
    outputs:
      test_type: ${{ steps.determine.outputs.test_type }}
      run_test: ${{ steps.determine.outputs.run_test }}
    steps:
      - name: Determine test type based on schedule
        id: determine
        run: |
          # Default to manual input if provided
          if [ -n "${{ github.event.inputs.test_type }}" ]; then
            echo "test_type=${{ github.event.inputs.test_type }}" >> $GITHUB_OUTPUT
            echo "run_test=true" >> $GITHUB_OUTPUT
            echo "Running manual test: ${{ github.event.inputs.test_type }}"
            exit 0
          fi

          # Determine based on cron schedule
          HOUR=$(date -u +%H)
          DAY_OF_WEEK=$(date -u +%u)

          echo "Current UTC time: $HOUR:00, Day: $DAY_OF_WEEK"

          # Check which cron triggered this
          if [ "${{ github.event.schedule }}" = "0 3 * * 0" ]; then
            echo "test_type=full_validation" >> $GITHUB_OUTPUT
            echo "run_test=true" >> $GITHUB_OUTPUT
            echo "Running weekly full validation"
          elif [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then
            echo "test_type=dry_run" >> $GITHUB_OUTPUT
            echo "run_test=true" >> $GITHUB_OUTPUT
            echo "Running daily dry-run"
          elif [ "${{ github.event.schedule }}" = "30 */6 * * *" ]; then
            echo "test_type=enhanced" >> $GITHUB_OUTPUT
            echo "run_test=true" >> $GITHUB_OUTPUT
            echo "Running 6-hourly enhanced test"
          elif [ "${{ github.event.schedule }}" = "15 * * * *" ]; then
            echo "test_type=quick" >> $GITHUB_OUTPUT
            echo "run_test=true" >> $GITHUB_OUTPUT
            echo "Running hourly quick test"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "test_type=enhanced" >> $GITHUB_OUTPUT
            echo "run_test=true" >> $GITHUB_OUTPUT
            echo "Running enhanced test for push event"
          else
            echo "test_type=quick" >> $GITHUB_OUTPUT
            echo "run_test=true" >> $GITHUB_OUTPUT
            echo "Running default quick test"
          fi

  quick-synthesis-test:
    name: Quick Synthesis Test
    runs-on: ubuntu-latest
    needs: determine-test-type
    if: needs.determine-test-type.outputs.test_type == 'quick' && needs.determine-test-type.outputs.run_test == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Build project
        run: |
          mvn clean install -DskipTests -f pom.xml
          # Now build cfc-testing module
          cd cfc-testing
          mvn clean package -DskipTests

      - name: Run quick synthesis test
        run: |
          cd cfc-testing
          # Run deployment-dry-run-tracker with quick subset (synthesis-only, no AWS)
          timeout 30m bash scripts/deployment-dry-run-tracker.sh || exit_code=$?
          if [ ${exit_code:-0} -eq 124 ]; then
            echo "Test timed out after 30 minutes"
            exit 1
          fi
          exit ${exit_code:-0}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-test-results-${{ github.run_number }}
          path: |
            cfc-testing/test-results/deployment-reports/
            cfc-testing/test-results/deployment-reports/historical/
          retention-days: 30

  enhanced-synthesis-test:
    name: Enhanced Synthesis Test
    runs-on: ubuntu-latest
    needs: determine-test-type
    if: needs.determine-test-type.outputs.test_type == 'enhanced' && needs.determine-test-type.outputs.run_test == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Build project
        run: |
          # First install parent project dependencies to local Maven repo
          mvn clean install -DskipTests -f pom.xml
          # Now build cfc-testing module
          cd cfc-testing
          mvn clean package -DskipTests

      - name: Run enhanced synthesis test
        run: |
          cd cfc-testing
          timeout 60m bash scripts/enhanced-synth-test.sh || exit_code=$?
          if [ ${exit_code:-0} -eq 124 ]; then
            echo "Test timed out after 60 minutes"
            exit 1
          fi
          exit ${exit_code:-0}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-test-results-${{ github.run_number }}
          path: |
            cfc-testing/test-results/enhanced-synth-results/
            cfc-testing/test-results/enhanced-synth-results/*.csv
          retention-days: 30

      - name: Generate performance report
        if: always()
        run: |
          cd cfc-testing
          if [ -f test-results/enhanced-synth-results/synthesis-metrics.csv ]; then
            echo "# Enhanced Synthesis Test Report" > test-results/enhanced-synth-results/report.md
            echo "Run: ${{ github.run_number }}" >> test-results/enhanced-synth-results/report.md
            echo "Date: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> test-results/enhanced-synth-results/report.md
            echo "" >> test-results/enhanced-synth-results/report.md
            echo "## Summary" >> test-results/enhanced-synth-results/report.md
            total=$(wc -l < test-results/enhanced-synth-results/synthesis-metrics.csv)
            successful=$(grep -c ",SUCCESS," test-results/enhanced-synth-results/synthesis-metrics.csv || echo "0")
            failed=$(grep -c ",FAILED," test-results/enhanced-synth-results/synthesis-metrics.csv || echo "0")
            echo "- Total Tests: $total" >> test-results/enhanced-synth-results/report.md
            echo "- Successful: $successful" >> test-results/enhanced-synth-results/report.md
            echo "- Failed: $failed" >> test-results/enhanced-synth-results/report.md
          fi

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-${{ github.run_number }}
          path: cfc-testing/test-results/enhanced-synth-results/report.md
          retention-days: 90

  deployment-dry-run:
    name: Deployment Dry-Run with AWS
    runs-on: ubuntu-latest
    needs: determine-test-type
    if: needs.determine-test-type.outputs.test_type == 'dry_run' && needs.determine-test-type.outputs.run_test == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MOCK_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MOCK_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity
          echo "AWS Region: ${AWS_DEFAULT_REGION:-us-east-1}"

      - name: Build project
        run: |
          # First install parent project dependencies to local Maven repo
          mvn clean install -DskipTests -f pom.xml
          # Now build cfc-testing module
          cd cfc-testing
          mvn clean package -DskipTests

      - name: Download historical metrics
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: deployment-metrics-history
          path: cfc-testing/test-results/deployment-reports/historical/

      - name: Run deployment dry-run with AWS
        env:
          DOMAIN: ${{ secrets.DEPLOYMENT_TEST_DOMAIN || 'cloudforgeci.com' }}
        run: |
          cd cfc-testing
          timeout 90m bash scripts/deployment-dry-run-tracker.sh || exit_code=$?
          if [ ${exit_code:-0} -eq 124 ]; then
            echo "Test timed out after 90 minutes"
            exit 1
          fi
          exit ${exit_code:-0}

      - name: Upload deployment reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-reports-${{ github.run_number }}
          path: |
            cfc-testing/test-results/deployment-reports/*.txt
            cfc-testing/test-results/deployment-reports/*.log
          retention-days: 90

      - name: Upload historical metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metrics-history
          path: cfc-testing/test-results/deployment-reports/historical/deployment-metrics.csv
          retention-days: 365

      - name: Analyze deployment trends
        if: always()
        run: |
          cd cfc-testing/test-results/deployment-reports/historical
          if [ -f deployment-metrics.csv ]; then
            echo "# Deployment Metrics Trends" > trends.md
            echo "Generated: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> trends.md
            echo "" >> trends.md

            # Calculate statistics
            total_runs=$(tail -n +2 deployment-metrics.csv | wc -l)
            success_runs=$(grep -c ",SUCCESS,\|,DRY_RUN_SUCCESS," deployment-metrics.csv || echo "0")
            dry_run_success=$(grep -c ",DRY_RUN_SUCCESS," deployment-metrics.csv || echo "0")

            echo "## Overall Statistics" >> trends.md
            echo "- Total Deployment Tests: $total_runs" >> trends.md
            echo "- Successful: $success_runs" >> trends.md
            echo "- Dry-Run Successful: $dry_run_success" >> trends.md
            echo "" >> trends.md

            # Average synthesis times by security profile
            echo "## Average Synthesis Times" >> trends.md
            for profile in "DEV" "STAGING" "PRODUCTION"; do
              avg=$(grep ",$profile," deployment-metrics.csv | grep ",SUCCESS,\|,DRY_RUN_SUCCESS," | awk -F',' '{sum+=$9; count++} END {if (count>0) printf "%.2f", sum/count}' || echo "N/A")
              echo "- $profile: ${avg}s" >> trends.md
            done

            # Average analysis times (deployment readiness analysis)
            echo "" >> trends.md
            echo "## Average Analysis Times (Deployment Readiness)" >> trends.md
            for profile in "DEV" "STAGING" "PRODUCTION"; do
              avg=$(grep ",$profile," deployment-metrics.csv | grep ",DRY_RUN_SUCCESS," | awk -F',' '{if($10>0) {sum+=$10; count++}} END {if (count>0) printf "%.2f", sum/count}' || echo "N/A")
              echo "- $profile: ${avg}s" >> trends.md
            done
          fi

      - name: Upload trends report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-trends-${{ github.run_number }}
          path: cfc-testing/test-results/deployment-reports/historical/trends.md
          retention-days: 90

  changeset-validation:
    name: Changeset Validation with AWS
    runs-on: ubuntu-latest
    needs: determine-test-type
    if: needs.determine-test-type.outputs.test_type == 'changeset_validation' && needs.determine-test-type.outputs.run_test == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity
          echo "AWS Region: ${AWS_DEFAULT_REGION:-us-east-1}"

      - name: Build project
        run: |
          # First install parent project dependencies to local Maven repo
          mvn clean install -DskipTests -f pom.xml
          # Now build cfc-testing module
          cd cfc-testing
          mvn clean package -DskipTests

      - name: Download historical changeset metrics
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: changeset-metrics-history
          path: cfc-testing/test-results/changeset-reports/historical/

      - name: Run changeset validation
        env:
          DOMAIN: ${{ secrets.DEPLOYMENT_TEST_DOMAIN || 'cloudforgeci.com' }}
        run: |
          cd cfc-testing
          timeout 90m bash scripts/deployment-changeset-validator.sh || exit_code=$?
          if [ ${exit_code:-0} -eq 124 ]; then
            echo "Test timed out after 90 minutes"
            exit 1
          fi
          exit ${exit_code:-0}

      - name: Upload changeset reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changeset-reports-${{ github.run_number }}
          path: |
            cfc-testing/test-results/changeset-reports/*.txt
            cfc-testing/test-results/changeset-reports/*.log
          retention-days: 90

      - name: Upload changeset metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changeset-metrics-history
          path: cfc-testing/test-results/changeset-reports/historical/changeset-metrics.csv
          retention-days: 365

      - name: Analyze changeset trends
        if: always()
        run: |
          cd cfc-testing/test-results/changeset-reports/historical
          if [ -f changeset-metrics.csv ]; then
            echo "# Changeset Validation Trends" > changeset-trends.md
            echo "Generated: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> changeset-trends.md
            echo "" >> changeset-trends.md

            # Calculate statistics
            total_runs=$(tail -n +2 changeset-metrics.csv | wc -l)
            success_runs=$(grep -c ",SUCCESS," changeset-metrics.csv || echo "0")

            echo "## Overall Statistics" >> changeset-trends.md
            echo "- Total Changeset Tests: $total_runs" >> changeset-trends.md
            echo "- Successful: $success_runs" >> changeset-trends.md
            echo "" >> changeset-trends.md

            # Average changeset creation times by security profile
            echo "## Average Changeset Creation Times" >> changeset-trends.md
            for profile in "DEV" "STAGING" "PRODUCTION"; do
              avg=$(grep ",$profile," changeset-metrics.csv | grep ",SUCCESS," | awk -F',' '{sum+=$10; count++} END {if (count>0) printf "%.2f", sum/count}' || echo "N/A")
              echo "- $profile: ${avg}s" >> changeset-trends.md
            done

            # Average resource changes
            echo "" >> changeset-trends.md
            echo "## Average Resource Changes" >> changeset-trends.md
            for profile in "DEV" "STAGING" "PRODUCTION"; do
              avg=$(grep ",$profile," changeset-metrics.csv | grep ",SUCCESS," | awk -F',' '{sum+=$11; count++} END {if (count>0) printf "%.0f", sum/count}' || echo "N/A")
              echo "- $profile: ${avg} resources" >> changeset-trends.md
            done
          fi

      - name: Upload changeset trends
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changeset-trends-${{ github.run_number }}
          path: cfc-testing/test-results/changeset-reports/historical/changeset-trends.md
          retention-days: 90

  full-resource-validation:
    name: Full Resource Validation
    runs-on: ubuntu-latest
    needs: determine-test-type
    if: needs.determine-test-type.outputs.test_type == 'full_validation' && needs.determine-test-type.outputs.run_test == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Install additional dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc

      - name: Build project
        run: |
          # First install parent project dependencies to local Maven repo
          mvn clean install -DskipTests -f pom.xml
          # Now build cfc-testing module
          cd cfc-testing
          mvn clean package -DskipTests

      - name: Run comprehensive resource validation
        run: |
          cd cfc-testing
          timeout 180m bash scripts/comprehensive-resource-validator.sh || exit_code=$?
          if [ ${exit_code:-0} -eq 124 ]; then
            echo "Validation timed out after 180 minutes"
            exit 1
          fi
          exit ${exit_code:-0}

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results-${{ github.run_number }}
          path: |
            cfc-testing/scripts/validation-results/
            cfc-testing/scripts/validation-results/drift-report.txt
          retention-days: 90

      - name: Check for validation failures
        if: always()
        run: |
          cd cfc-testing
          if [ -f scripts/validation-results/drift-report.txt ]; then
            failures=$(grep -c "MISSING_RESOURCES\|SYNTHESIS_FAILED" scripts/validation-results/drift-report.txt || echo "0")
            if [ "$failures" -gt 0 ]; then
              echo "::warning::Found $failures validation failures"
              echo "Failed configurations:"
              grep "MISSING_RESOURCES\|SYNTHESIS_FAILED" scripts/validation-results/drift-report.txt | head -10
            else
              echo "✅ All validations passed!"
            fi
          fi

  publish-metrics:
    name: Publish Metrics Dashboards
    runs-on: ubuntu-latest
    needs: [quick-synthesis-test, enhanced-synthesis-test, deployment-dry-run, changeset-validation, full-resource-validation]
    if: always() && (needs.deployment-dry-run.result == 'success' || needs.changeset-validation.result == 'success' || needs.enhanced-synthesis-test.result == 'success')
    permissions:
      contents: read
    steps:
      - name: Create metrics directories
        run: |
          mkdir -p metrics-dashboards/deployment-metrics/data
          mkdir -p metrics-dashboards/changeset-validation/data

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Copy deployment metrics data
        run: |
          # Copy deployment metrics CSV if available
          if [ -f "artifacts/deployment-metrics-history/deployment-metrics.csv" ]; then
            cp artifacts/deployment-metrics-history/deployment-metrics.csv metrics-dashboards/deployment-metrics/data/
            echo "✅ Copied deployment metrics CSV"
          else
            echo "⚠️  No deployment metrics CSV found"
            # Create empty CSV with header
            echo "RunID,Timestamp,StackName,Runtime,SecurityProfile,AuthMode,NetworkMode,ComplianceFrameworks,SynthTime,AnalysisTime,ResourceCount,Status,ErrorMessage" > metrics-dashboards/deployment-metrics/data/deployment-metrics.csv
          fi

          # Copy trends markdown if available
          if [ -f "artifacts/deployment-trends-${{ github.run_number }}/trends.md" ]; then
            cp "artifacts/deployment-trends-${{ github.run_number }}/trends.md" metrics-dashboards/deployment-metrics/data/latest-trends.md
            echo "✅ Copied trends report"
          else
            echo "No trends data available yet" > metrics-dashboards/deployment-metrics/data/latest-trends.md
          fi

          # Copy test reports
          if [ -d "artifacts/deployment-reports-${{ github.run_number }}" ]; then
            mkdir -p metrics-dashboards/deployment-metrics/reports
            cp -r "artifacts/deployment-reports-${{ github.run_number }}"/* metrics-dashboards/deployment-metrics/reports/ 2>/dev/null || true
            echo "✅ Copied deployment reports"
          fi

          # Copy changeset validation metrics
          if [ -f "artifacts/changeset-metrics-history/changeset-metrics.csv" ]; then
            cp artifacts/changeset-metrics-history/changeset-metrics.csv metrics-dashboards/changeset-validation/data/
            echo "✅ Copied changeset metrics CSV"
          else
            echo "⚠️  No changeset metrics CSV found"
            # Create empty CSV with header
            echo "RunID,Timestamp,StackName,Runtime,SecurityProfile,AuthMode,NetworkMode,ComplianceFrameworks,SynthTime,ChangesetTime,TotalChanges,ResourcesAdded,ResourcesModified,ResourcesRemoved,Status,ErrorMessage" > metrics-dashboards/changeset-validation/data/changeset-metrics.csv
          fi

          # Copy changeset trends
          if [ -f "artifacts/changeset-trends-${{ github.run_number }}/changeset-trends.md" ]; then
            cp "artifacts/changeset-trends-${{ github.run_number }}/changeset-trends.md" metrics-dashboards/changeset-validation/data/latest-trends.md
            echo "✅ Copied changeset trends"
          else
            echo "No changeset trends data available yet" > metrics-dashboards/changeset-validation/data/latest-trends.md
          fi

          # Copy changeset reports
          if [ -d "artifacts/changeset-reports-${{ github.run_number }}" ]; then
            mkdir -p metrics-dashboards/changeset-validation/reports
            cp -r "artifacts/changeset-reports-${{ github.run_number }}"/* metrics-dashboards/changeset-validation/reports/ 2>/dev/null || true
            echo "✅ Copied changeset reports"
          fi

      - name: Generate metrics dashboard
        run: |
          cat > metrics-dashboards/deployment-metrics/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>CloudForge Core - Deployment Testing Metrics</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      padding: 20px;
                  }
                  .container { max-width: 1400px; margin: 0 auto; }
                  .header {
                      text-align: center;
                      color: white;
                      padding: 40px 20px;
                  }
                  .header h1 { font-size: 3em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
                  .header p { font-size: 1.2em; opacity: 0.9; }
                  .timestamp {
                      text-align: center;
                      color: white;
                      margin: 20px 0;
                      font-style: italic;
                      opacity: 0.8;
                  }
                  .metrics-grid {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                      gap: 20px;
                      margin: 30px 0;
                  }
                  .metric-card {
                      background: white;
                      padding: 25px;
                      border-radius: 12px;
                      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                      transition: transform 0.3s ease;
                  }
                  .metric-card:hover {
                      transform: translateY(-5px);
                  }
                  .metric-value {
                      font-size: 48px;
                      font-weight: bold;
                      color: #667eea;
                      margin-bottom: 10px;
                  }
                  .metric-label {
                      color: #666;
                      font-size: 16px;
                      font-weight: 500;
                  }
                  .section {
                      background: white;
                      border-radius: 12px;
                      padding: 30px;
                      margin: 20px 0;
                      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                  }
                  .section h2 {
                      color: #667eea;
                      margin-bottom: 20px;
                      font-size: 1.8em;
                  }
                  .trends-content {
                      background: #f6f8fa;
                      padding: 20px;
                      border-radius: 8px;
                      font-family: monospace;
                      white-space: pre-wrap;
                      max-height: 600px;
                      overflow-y: auto;
                  }
                  .back-link {
                      display: inline-block;
                      color: white;
                      text-decoration: none;
                      font-weight: 500;
                      margin-bottom: 20px;
                      padding: 10px 20px;
                      background: rgba(255,255,255,0.2);
                      border-radius: 6px;
                      transition: background 0.3s ease;
                  }
                  .back-link:hover {
                      background: rgba(255,255,255,0.3);
                  }
                  table {
                      width: 100%;
                      border-collapse: collapse;
                      margin-top: 20px;
                  }
                  th, td {
                      text-align: left;
                      padding: 12px;
                      border-bottom: 1px solid #e1e4e8;
                  }
                  th {
                      background: #f6f8fa;
                      font-weight: 600;
                      color: #24292e;
                  }
                  tr:hover {
                      background: #f6f8fa;
                  }
                  .status-success { color: #28a745; font-weight: bold; }
                  .status-failed { color: #dc3545; font-weight: bold; }
                  .chart-placeholder {
                      text-align: center;
                      padding: 40px;
                      color: #666;
                      font-style: italic;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <a href="../index.html" class="back-link">← Back to Dashboard</a>

                  <div class="header">
                      <h1>🚀 Deployment Testing Metrics</h1>
                      <p>Continuous deployment validation and performance tracking</p>
                  </div>

                  <div class="timestamp">
                      Last Updated: <span id="timestamp"></span>
                  </div>

                  <div class="metrics-grid">
                      <div class="metric-card">
                          <div class="metric-value" id="total-runs">-</div>
                          <div class="metric-label">Total Test Runs</div>
                      </div>
                      <div class="metric-card">
                          <div class="metric-value" id="success-rate">-</div>
                          <div class="metric-label">Success Rate</div>
                      </div>
                      <div class="metric-card">
                          <div class="metric-value" id="avg-synth-time">-</div>
                          <div class="metric-label">Avg Synthesis Time</div>
                      </div>
                      <div class="metric-card">
                          <div class="metric-value" id="avg-deploy-time">-</div>
                          <div class="metric-label">Avg Analysis Time</div>
                      </div>
                  </div>

                  <div class="section">
                      <h2>📊 Historical Trends</h2>
                      <div id="trends-content" class="trends-content">Loading trends data...</div>
                  </div>

                  <div class="section">
                      <h2>📋 Recent Test Results</h2>
                      <div id="recent-results">
                          <table id="results-table">
                              <thead>
                                  <tr>
                                      <th>Timestamp</th>
                                      <th>Stack Name</th>
                                      <th>Runtime</th>
                                      <th>Security Profile</th>
                                      <th>Auth Mode</th>
                                      <th>Synth Time</th>
                                      <th>Status</th>
                                  </tr>
                              </thead>
                              <tbody id="results-body">
                                  <tr><td colspan="7" class="chart-placeholder">Loading results...</td></tr>
                              </tbody>
                          </table>
                      </div>
                  </div>
              </div>

              <script>
                  // Set timestamp
                  document.getElementById('timestamp').textContent = new Date().toUTCString();

                  // Load trends data
                  fetch('data/latest-trends.md')
                      .then(response => response.text())
                      .then(text => {
                          document.getElementById('trends-content').textContent = text || 'No trends data available yet';
                      })
                      .catch(() => {
                          document.getElementById('trends-content').textContent = 'Trends data will appear after first deployment test run';
                      });

                  // Load and parse metrics CSV
                  fetch('data/deployment-metrics.csv')
                      .then(response => response.text())
                      .then(csv => {
                          const lines = csv.trim().split('\n');
                          if (lines.length <= 1) {
                              return;
                          }

                          // Parse CSV (skip header)
                          const rows = lines.slice(1).map(line => {
                              const parts = line.split(',');
                              return {
                                  runId: parts[0],
                                  timestamp: parts[1],
                                  stackName: parts[2],
                                  runtime: parts[3],
                                  securityProfile: parts[4],
                                  authMode: parts[5],
                                  networkMode: parts[6],
                                  complianceFrameworks: parts[7],
                                  synthTime: parseFloat(parts[8]),
                                  analysisTime: parseFloat(parts[9]),
                                  resourceCount: parseInt(parts[10]),
                                  status: parts[11]
                              };
                          });

                          // Calculate metrics
                          const totalRuns = rows.length;
                          const successfulRuns = rows.filter(r => r.status.includes('SUCCESS')).length;
                          const successRate = ((successfulRuns / totalRuns) * 100).toFixed(1);

                          const avgSynthTime = (rows.reduce((sum, r) => sum + r.synthTime, 0) / rows.length).toFixed(1);
                          const analysisCounts = rows.filter(r => r.analysisTime > 0);
                          const avgAnalysisTime = analysisCounts.length > 0
                              ? (analysisCounts.reduce((sum, r) => sum + r.analysisTime, 0) / analysisCounts.length).toFixed(1)
                              : 'N/A';

                          // Update metrics
                          document.getElementById('total-runs').textContent = totalRuns;
                          document.getElementById('success-rate').textContent = successRate + '%';
                          document.getElementById('avg-synth-time').textContent = avgSynthTime + 's';
                          document.getElementById('avg-deploy-time').textContent = avgAnalysisTime === 'N/A' ? avgAnalysisTime : avgAnalysisTime + 's';

                          // Show recent results (last 20)
                          const recentRows = rows.slice(-20).reverse();
                          const tbody = document.getElementById('results-body');
                          tbody.innerHTML = recentRows.map(row => `
                              <tr>
                                  <td>${row.timestamp}</td>
                                  <td>${row.stackName}</td>
                                  <td>${row.runtime}</td>
                                  <td>${row.securityProfile}</td>
                                  <td>${row.authMode}</td>
                                  <td>${row.synthTime.toFixed(1)}s</td>
                                  <td class="${row.status.includes('SUCCESS') ? 'status-success' : 'status-failed'}">${row.status}</td>
                              </tr>
                          `).join('');
                      })
                      .catch(err => {
                          console.error('Error loading metrics:', err);
                          document.getElementById('results-body').innerHTML = '<tr><td colspan="7" class="chart-placeholder">Metrics data will appear after first deployment test run</td></tr>';
                      });
              </script>
          </body>
          </html>
          HTMLEOF

