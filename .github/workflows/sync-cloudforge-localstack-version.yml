name: Sync cloudforge-localstack.version

# Keeps this repo's reference to cloudforge-localstack's latest published SNAPSHOT current (the
# root pom's <cloudforge-localstack.version> property and its BOM dependencyManagement entry).
#
# Managing the version in the BOM means every consumer that imports it picks it up through
# <scope>import</scope>, with no per-consumer sync pipeline. A BOM entry is only a coordinate +
# version, so this tracks, but does not couple, cloudforge-localstack's own release cadence --
# which is itself cfc-core's own cadence, since cloudforge-localstack is published in lockstep
# with cfc-core's releases (see publish-release-branch.yml). The committed property here is
# always a SNAPSHOT; that workflow swaps it to this release's own version just for that build,
# never committing the swap.
#
# Pull-based (this repo polls cloudforge-localstack's published Central snapshots metadata) and
# develop-only, like this repo's other scheduled workflows.

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-cloudforge-localstack-version
  cancel-in-progress: false

jobs:
  sync:
    name: Sync cloudforge-localstack.version to its latest published SNAPSHOT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # This repo's root pom declares no repositories, so Maven only looks at Central for releases
      # and the versions plugin never sees a newer SNAPSHOT: without this the step reports
      # "nothing to do" forever. Scoped to the one command that needs it, not a pom change,
      # because the root pom is the parent every consumer inherits.
      - name: Make Central's snapshots repository visible to the versions plugin
        run: |
          cat > "$RUNNER_TEMP/snapshot-settings.xml" <<'EOF'
          <settings>
            <profiles>
              <profile>
                <id>central-snapshots</id>
                <repositories>
                  <repository>
                    <id>central-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <releases><enabled>false</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles><activeProfile>central-snapshots</activeProfile></activeProfiles>
          </settings>
          EOF

      - name: Update cloudforge-localstack.version to its own latest SNAPSHOT
        run: >
          mvn -B -q -s "$RUNNER_TEMP/snapshot-settings.xml" versions:update-property
          -Dproperty=cloudforge-localstack.version
          -DallowSnapshots=true
          -DgenerateBackupPoms=false
          "-Dmaven.version.ignore=^[0-9]+\.[0-9]+\.[0-9]+$"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- pom.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream version change detected; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- pom.xml
          fi

      - name: Validate the BOM against the updated version
        if: steps.diff.outputs.changed == 'true'
        run: mvn -B -q validate

      # develop requires 6 status checks on every direct push, enforced regardless of what pushed
      # it. enforce_admins is false, so a real repo admin is exempt; GITHUB_TOKEN never carries
      # that role no matter what permissions: grants it. ADMIN_BYPASS_TOKEN is a PAT from an
      # actual CloudForgeCI admin account, which is what actually satisfies enforce_admins.
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ADMIN_BYPASS_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LOCALSTACK_V=$(mvn -q help:evaluate -Dexpression=cloudforge-localstack.version -DforceStdout)
          git add pom.xml
          git commit -m "chore(deps): sync cloudforge-localstack.version=${LOCALSTACK_V} [skip ci]"
          git pull --rebase origin develop
          # actions/checkout@v4 leaves GITHUB_TOKEN in http.https://github.com/.extraheader, which
          # git prefers over the credential embedded in the push URL below -- clearing it for just
          # this invocation is what actually makes the PAT the one used, instead of silently
          # falling back to GITHUB_TOKEN and failing the same required-check rejection again.
          git -c http.https://github.com/.extraheader= push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:develop
