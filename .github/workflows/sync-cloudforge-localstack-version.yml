name: Sync cloudforge-localstack.version

# Opens a pull request that bumps the root pom's <cloudforge-localstack.version> property (and with it the
# BOM's dependencyManagement entry) to the latest release of cloudforge-localstack on Maven Central.
#
# cloudforge-localstack lives in its own repository, declares this pom as its Maven <parent>, and publishes
# releases in lockstep with this pom's version (its own sync-cfc-core-version.yml follows a cfc-core
# release within minutes). cloudforge-api compiles against a pinned release of it, not a SNAPSHOT, so a
# release of cfc-core always pins the previous one; this keeps that pin from being forgotten, while a
# reviewed pull request, built and tested like any other, decides when to adopt a release.
#
# Pull-based (polls Central's release metadata) and develop-only, like this repo's other scheduled
# workflows. A pull request opened with GITHUB_TOKEN does not start other workflows by itself; push an
# empty commit to the branch or close and reopen the pull request to run the required checks.

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-cloudforge-localstack-version
  cancel-in-progress: false

jobs:
  sync:
    name: Propose the latest cloudforge-localstack release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Resolved directly from Central's metadata, not versions:update-property: that plugin
      # compares the current pin against candidate versions by Maven's normal version ordering,
      # under which a SNAPSHOT of a higher release sorts newer than an actual lower release -- so
      # once this pin is wrongly left on a SNAPSHOT, the plugin reports "already at the latest
      # release" forever and never corrects it (confirmed against cloudforge-ministack.version,
      # which hit exactly this gap). A direct string comparison, with a SNAPSHOT pin always
      # treated as stale, does not have that blind spot.
      - name: Resolve cloudforge-localstack's latest published release
        id: latest
        run: |
          RELEASE=$(curl -fsSL "https://repo1.maven.org/maven2/com/cloudforgeci/cloudforge-localstack/maven-metadata.xml" \
            | grep -o '<release>[^<]*</release>' | sed -E 's|</?release>||g')
          if [ -z "$RELEASE" ]; then
            echo "::error::Could not resolve cloudforge-localstack's latest release from Central's maven-metadata.xml"
            exit 1
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: diff
        run: |
          PINNED=$(mvn -q -B help:evaluate -Dexpression=cloudforge-localstack.version -DforceStdout)
          RELEASE="${{ steps.latest.outputs.release }}"
          if [ "$PINNED" = "$RELEASE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already pinned to the latest release $RELEASE; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$RELEASE" >> "$GITHUB_OUTPUT"
            mvn -q -B versions:set-property -Dproperty=cloudforge-localstack.version \
              -DnewVersion="$RELEASE" -DgenerateBackupPoms=false
            git diff -- pom.xml
          fi

      - name: Validate the BOM against the updated version
        if: steps.diff.outputs.changed == 'true'
        run: mvn -B -q validate

      - name: Open the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.diff.outputs.version }}
        run: |
          BRANCH="chore/sync-cloudforge-localstack-$VERSION"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "$BRANCH already exists; its pull request is already open or was merged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pom.xml
          git commit -m "chore(deps): pin cloudforge-localstack $VERSION"
          git push origin "$BRANCH"
          gh pr create --base develop --head "$BRANCH" \
            --title "chore(deps): pin cloudforge-localstack $VERSION" \
            --body "Bumps cloudforge-localstack.version to the release $VERSION, the latest on Maven Central."
