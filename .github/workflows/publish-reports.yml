name: Publish Reports to GitHub Pages

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-reports:
    name: Build and Aggregate Reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-pip
          pip3 install --upgrade pip

      - name: Install AWS CDK
        run: |
          npm install -g aws-cdk
          cdk --version

      - name: Get current date for cache key
        id: date
        run: echo "date=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials (for CDK synth only)
        env:
          MOCK_AWS_ACCESS_KEY_ID: ${{ secrets.MOCK_AWS_ACCESS_KEY_ID }}
          MOCK_AWS_SECRET_ACCESS_KEY: ${{ secrets.MOCK_AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id = ${MOCK_AWS_ACCESS_KEY_ID}
          aws_secret_access_key = ${MOCK_AWS_SECRET_ACCESS_KEY}
          EOF
          cat > ~/.aws/config << EOF
          [default]
          region = us-east-1
          output = json
          EOF

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache OWASP Dependency-Check NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/dependency-check-data
          # Cache key based on year-week (YYYY-WW) - updates weekly for fresh CVE data
          # This prevents re-downloading the ~1GB NVD database on every run
          key: ${{ runner.os }}-dependency-check-v12-${{ steps.date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-v12-

      - name: Build and test with coverage
        run: |
          echo "Building project with tests and coverage..."
          mvn clean install -B -V
          echo "Build complete"

      - name: Prepare CDK dependencies for validation
        run: |
          cd cfc-testing
          if [ ! -d "target/classes" ]; then
            echo "Building cfc-testing module..."
            mvn clean install -DskipTests -B
          fi
          if [ ! -d "target/dependency" ]; then
            mvn dependency:copy-dependencies -DoutputDirectory=target/dependency -B
          fi
          chmod +x scripts/*.sh 2>/dev/null || true
          mkdir -p scripts/validation-results scripts/synth-results

      - name: Run CFC validation (full mode for GitHub Pages)
        continue-on-error: true
        run: |
          cd cfc-testing
          echo "Running full validation to generate truth tables for GitHub Pages..."
          bash scripts/master-validation-system.sh full 2>&1 | tee validation-run.log || true

      - name: Generate compliance truth table report
        continue-on-error: true
        run: |
          cd cfc-testing/scripts
          echo "Generating compliance truth table report..."
          python3 compliance-truth-table-generator.py 2>&1 | tee compliance-truth-table.log || true
          echo "✅ Compliance truth table generation complete"

      - name: Run comprehensive synthesis tests
        continue-on-error: true
        run: |
          cd cfc-testing
          echo "Running comprehensive synthesis tests..."
          bash scripts/comprehensive-synth-test.sh 2>&1 | tee comprehensive-synth.log || true
          echo "✅ Comprehensive synthesis tests complete"

      - name: Generate synthesis test HTML report
        continue-on-error: true
        run: |
          cd cfc-testing/scripts
          echo "Generating synthesis test HTML report..."
          bash generate-synth-report.sh || true
          echo "✅ Synthesis report generation complete"

      - name: Create reports directory structure
        run: |
          mkdir -p github-pages-reports/{coverage,validation,drift,sbom}
          echo "Reports directory created"

      - name: Copy coverage reports
        run: |
          echo "Copying coverage reports..."

          # Copy API coverage
          if [ -d "cloudforge-api/target/site/jacoco" ]; then
            mkdir -p github-pages-reports/coverage/cloudforge-api
            cp -r cloudforge-api/target/site/jacoco/* github-pages-reports/coverage/cloudforge-api/
            echo "✅ Copied cloudforge-api coverage"
          fi

          # Copy Core coverage
          if [ -d "cloudforge-core/target/site/jacoco" ]; then
            mkdir -p github-pages-reports/coverage/cloudforge-core
            cp -r cloudforge-core/target/site/jacoco/* github-pages-reports/coverage/cloudforge-core/
            echo "✅ Copied cloudforge-core coverage"
          fi

      - name: Copy surefire test reports
        run: |
          echo "Copying surefire test reports..."

          # Copy API surefire reports
          if [ -d "cloudforge-api/target/surefire-reports" ]; then
            mkdir -p github-pages-reports/coverage/cloudforge-api/surefire-reports
            cp -r cloudforge-api/target/surefire-reports/* github-pages-reports/coverage/cloudforge-api/surefire-reports/
            echo "✅ Copied cloudforge-api surefire reports"
          fi

          # Copy Core surefire reports
          if [ -d "cloudforge-core/target/surefire-reports" ]; then
            mkdir -p github-pages-reports/coverage/cloudforge-core/surefire-reports
            cp -r cloudforge-core/target/surefire-reports/* github-pages-reports/coverage/cloudforge-core/surefire-reports/
            echo "✅ Copied cloudforge-core surefire reports"
          fi

      - name: Generate surefire reports index pages
        run: |
          # Function to generate index.html for a surefire-reports directory
          generate_surefire_index() {
            local dir=$1
            local module_name=$2

            if [ ! -d "$dir" ]; then
              return
            fi

            # Count files first
            local file_count=0
            for xml_file in "$dir"/*.xml; do
              if [ -f "$xml_file" ]; then
                file_count=$((file_count + 1))
              fi
            done

            # Generate HTML file
            cat > "$dir/index.html" << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>$module_name Test Reports</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      padding: 20px;
                  }
                  .container { max-width: 1200px; margin: 0 auto; }
                  .header {
                      text-align: center;
                      color: white;
                      padding: 40px 20px;
                  }
                  .header h1 { font-size: 2.5em; margin-bottom: 10px; }
                  .content {
                      background: white;
                      border-radius: 12px;
                      padding: 30px;
                      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                  }
                  .test-list {
                      list-style: none;
                      padding: 0;
                  }
                  .test-item {
                      padding: 15px;
                      margin: 10px 0;
                      background: #f6f8fa;
                      border-radius: 6px;
                      border-left: 4px solid #667eea;
                  }
                  .test-item:hover {
                      background: #e8eaf6;
                      transform: translateX(5px);
                      transition: all 0.3s ease;
                  }
                  .test-item a {
                      color: #667eea;
                      text-decoration: none;
                      font-weight: 500;
                      font-size: 1.1em;
                  }
                  .test-item a:hover {
                      color: #764ba2;
                  }
                  .back-link {
                      display: inline-block;
                      margin-top: 20px;
                      color: white;
                      text-decoration: none;
                      padding: 10px 20px;
                      background: rgba(255,255,255,0.2);
                      border-radius: 6px;
                  }
                  .back-link:hover {
                      background: rgba(255,255,255,0.3);
                  }
                  .file-count {
                      text-align: center;
                      margin: 20px 0;
                      font-size: 1.2em;
                      color: #666;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h1>📋 $module_name Test Reports</h1>
                      <p>JUnit Surefire XML Test Reports</p>
                      <a href="../../" class="back-link">← Back to All Reports</a>
                  </div>
                  <div class="content">
                      <div class="file-count">
                          <strong>$file_count</strong> test report files
                      </div>
                      <ul class="test-list">
          EOF

            # Generate file list directly
            for xml_file in "$dir"/*.xml; do
              if [ -f "$xml_file" ]; then
                local filename=$(basename "$xml_file")
                echo "                        <li class=\"test-item\"><a href=\"$filename\">$filename</a></li>" >> "$dir/index.html"
              fi
            done

            # Close HTML
            cat >> "$dir/index.html" << 'EOF'
                      </ul>
                  </div>
              </div>
          </body>
          </html>
          EOF

            echo "✅ Generated index for $module_name ($file_count files)"
          }

          # Generate indexes for both modules
          generate_surefire_index "github-pages-reports/coverage/cloudforge-api/surefire-reports" "CloudForge API"
          generate_surefire_index "github-pages-reports/coverage/cloudforge-core/surefire-reports" "CloudForge Core"

      - name: Copy validation reports
        run: |
          echo "Copying validation reports..."

          if [ -d "cfc-testing/scripts/validation-results" ]; then
            cp -r cfc-testing/scripts/validation-results/* github-pages-reports/validation/ 2>/dev/null || true
            echo "✅ Copied validation results"
          fi

          if [ -f "cfc-testing/validation-run.log" ]; then
            cp cfc-testing/validation-run.log github-pages-reports/validation/
            echo "✅ Copied validation log"
          fi

          if [ -f "cfc-testing/comprehensive-synth.log" ]; then
            cp cfc-testing/comprehensive-synth.log github-pages-reports/validation/
            echo "✅ Copied comprehensive synthesis log"
          fi

      - name: Copy drift reports
        run: |
          echo "Copying drift reports..."

          if [ -d "cfc-testing/scripts/validation-results/drift-reports" ]; then
            cp -r cfc-testing/scripts/validation-results/drift-reports/* github-pages-reports/drift/ 2>/dev/null || true
            echo "✅ Copied drift reports"
          fi

          # Also copy the drift-report.txt if it exists
          if [ -f "cfc-testing/scripts/validation-results/drift-report.txt" ]; then
            cp cfc-testing/scripts/validation-results/drift-report.txt github-pages-reports/drift/
            echo "✅ Copied drift-report.txt"
          fi

      - name: Generate drift report index
        run: |
          cat > github-pages-reports/drift/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Drift Detection Reports</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      padding: 20px;
                  }
                  .container { max-width: 1200px; margin: 0 auto; }
                  .header {
                      text-align: center;
                      color: white;
                      padding: 40px 20px;
                  }
                  .header h1 { font-size: 2.5em; margin-bottom: 10px; }
                  .content {
                      background: white;
                      border-radius: 12px;
                      padding: 30px;
                      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                  }
                  pre {
                      background: #f6f8fa;
                      padding: 20px;
                      border-radius: 6px;
                      overflow-x: auto;
                      font-size: 0.9em;
                      line-height: 1.6;
                  }
                  .back-link {
                      display: inline-block;
                      margin-bottom: 20px;
                      color: #667eea;
                      text-decoration: none;
                      font-weight: 500;
                  }
                  .back-link:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h1>🔍 Drift Detection Reports</h1>
                      <p>Infrastructure Validation Results</p>
                  </div>
                  <div class="content">
                      <a href="../index.html" class="back-link">← Back to Dashboard</a>
                      <h2>Drift Report</h2>
                      <pre id="report-content">Loading...</pre>
                  </div>
              </div>
              <script>
                  fetch('drift-report.txt')
                      .then(response => response.text())
                      .then(text => {
                          document.getElementById('report-content').textContent = text || 'No drift report available';
                      })
                      .catch(err => {
                          document.getElementById('report-content').textContent = 'No drift report available';
                      });
              </script>
          </body>
          </html>
          EOF
          echo "✅ Generated drift report index"

      - name: Generate dependency-check reports
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
          OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}
        run: |
          echo "Generating OWASP Dependency-Check reports..."

          # Configure OSS Index credentials if available
          if [ -n "$OSSINDEX_USERNAME" ] && [ -n "$OSSINDEX_TOKEN" ]; then
            mkdir -p ~/.m2
            cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>ossindex</id>
                <username>${OSSINDEX_USERNAME}</username>
                <password>${OSSINDEX_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
            echo "✅ Configured OSS Index credentials"
          else
            echo "⚠️  OSS Index credentials not available"
          fi

          # First, update the NVD database (required when autoUpdate=false in pom.xml)
          echo "Updating NVD database..."
          mvn dependency-check:update-only -Psecurity-scan || {
            echo "⚠️  NVD database update had issues, proceeding anyway..."
          }

          # Run dependency check with aggregate goal for multi-module project
          EXIT_CODE=0
          mvn dependency-check:aggregate -Psecurity-scan -e || EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            echo "⚠️  Dependency check exited with code $EXIT_CODE"
            echo "Attempting to list any partial reports that may have been generated..."
            find . -name "dependency-check-report.*" -type f 2>/dev/null || echo "No dependency-check files found"
          fi

          # Clean up credentials file (extra safety, runner is ephemeral anyway)
          rm -f ~/.m2/settings.xml

          # Check what reports were actually generated
          echo "Checking generated dependency-check reports:"
          echo "Searching in all target directories..."
          find . -name "dependency-check-report.*" -type f -ls 2>/dev/null || true

          # Look for reports in root target (expected with aggregate=true)
          if [ -f "target/dependency-check-report.html" ]; then
            echo "✅ HTML report generated: $(ls -lh target/dependency-check-report.html | awk '{print $5}')"
          else
            echo "❌ HTML report NOT found in target/"
          fi

          if [ -f "target/dependency-check-report.json" ]; then
            echo "✅ JSON report generated: $(ls -lh target/dependency-check-report.json | awk '{print $5}')"
          else
            echo "❌ JSON report NOT found in target/"
          fi

          if [ -f "target/dependency-check-report.xml" ]; then
            echo "✅ XML report generated: $(ls -lh target/dependency-check-report.xml | awk '{print $5}')"
          else
            echo "❌ XML report NOT found in target/"
          fi

          echo "✅ Dependency-Check step completed"

      - name: Copy SBOM and security reports
        run: |
          echo "Copying SBOM and security reports..."

          # Copy SBOM files
          if [ -f "target/cfc-core-sbom.json" ]; then
            cp target/cfc-core-sbom.json github-pages-reports/sbom/
            echo "✅ Copied SBOM JSON"
          else
            echo "⚠️  SBOM JSON not found (expected at target/cfc-core-sbom.json)"
          fi

          if [ -f "target/cfc-core-sbom.xml" ]; then
            cp target/cfc-core-sbom.xml github-pages-reports/sbom/
            echo "✅ Copied SBOM XML"
          else
            echo "⚠️  SBOM XML not found (expected at target/cfc-core-sbom.xml)"
          fi

          # Copy dependency-check reports
          mkdir -p github-pages-reports/sbom/dependency-check

          # Function to find and copy a report file
          copy_dependency_report() {
            local format=$1
            local filename="dependency-check-report.${format}"

            # First try root target (expected with aggregate=true)
            if [ -f "target/${filename}" ]; then
              cp "target/${filename}" github-pages-reports/sbom/dependency-check/
              echo "✅ Copied dependency-check ${format^^} report from target/"
            else
              # Search in all target directories
              local found_file=$(find . -name "${filename}" -type f -print -quit 2>/dev/null)
              if [ -n "$found_file" ]; then
                cp "$found_file" github-pages-reports/sbom/dependency-check/
                echo "✅ Copied dependency-check ${format^^} report from ${found_file}"
              else
                echo "⚠️  Dependency-check ${format^^} report not found - will not be available on GitHub Pages"
              fi
            fi
          }

          copy_dependency_report "html"
          copy_dependency_report "json"
          copy_dependency_report "xml"

      - name: Generate reports index page
        run: |
          cat > github-pages-reports/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>CFC Core - Reports Dashboard</title>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                      line-height: 1.6;
                      color: #24292e;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      padding: 20px;
                  }
                  .container {
                      max-width: 1200px;
                      margin: 0 auto;
                  }
                  .header {
                      text-align: center;
                      color: white;
                      padding: 40px 20px;
                  }
                  .header h1 {
                      font-size: 3em;
                      margin-bottom: 10px;
                      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
                  }
                  .header p {
                      font-size: 1.2em;
                      opacity: 0.9;
                  }
                  .timestamp {
                      text-align: center;
                      color: white;
                      margin: 20px 0;
                      font-style: italic;
                  }
                  .grid {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                      gap: 30px;
                      margin-top: 40px;
                  }
                  .card {
                      background: white;
                      border-radius: 12px;
                      padding: 30px;
                      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                      transition: transform 0.3s ease, box-shadow 0.3s ease;
                  }
                  .card:hover {
                      transform: translateY(-5px);
                      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
                  }
                  .card-icon {
                      font-size: 3em;
                      margin-bottom: 15px;
                  }
                  .card h2 {
                      color: #667eea;
                      margin-bottom: 15px;
                      font-size: 1.8em;
                  }
                  .card p {
                      color: #586069;
                      margin-bottom: 20px;
                  }
                  .card ul {
                      list-style: none;
                      margin: 20px 0;
                  }
                  .card ul li {
                      padding: 10px 0;
                      border-bottom: 1px solid #e1e4e8;
                  }
                  .card ul li:last-child {
                      border-bottom: none;
                  }
                  .card a {
                      color: #667eea;
                      text-decoration: none;
                      font-weight: 500;
                      transition: color 0.3s ease;
                  }
                  .card a:hover {
                      color: #764ba2;
                      text-decoration: underline;
                  }
                  .badge {
                      display: inline-block;
                      padding: 4px 12px;
                      border-radius: 12px;
                      font-size: 0.85em;
                      font-weight: 600;
                      margin-left: 10px;
                  }
                  .badge-success {
                      background: #d4edda;
                      color: #155724;
                  }
                  .badge-info {
                      background: #d1ecf1;
                      color: #0c5460;
                  }
                  .badge-warning {
                      background: #fff3cd;
                      color: #856404;
                  }
                  .footer {
                      text-align: center;
                      color: white;
                      margin-top: 60px;
                      padding: 20px;
                      opacity: 0.8;
                  }
                  .footer a {
                      color: white;
                      text-decoration: underline;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h1>🚀 CFC Core</h1>
                      <p>CloudForge CI - Reports Dashboard</p>
                  </div>

                  <div class="timestamp">
                      Last updated: <span id="timestamp"></span>
                  </div>

                  <div class="grid">
                      <!-- Code Coverage Card -->
                      <div class="card">
                          <div class="card-icon">📊</div>
                          <h2>Code Coverage</h2>
                          <p>JaCoCo test coverage reports for all modules</p>
                          <ul>
                              <li><a href="coverage/cloudforge-api/index.html">CloudForge API Coverage</a> <span class="badge badge-success">Latest</span></li>
                              <li><a href="coverage/cloudforge-core/index.html">CloudForge Core Coverage</a> <span class="badge badge-success">Latest</span></li>
                              <li><a href="coverage/cloudforge-api/surefire-reports/index.html">CloudForge API Test Reports</a></li>
                              <li><a href="coverage/cloudforge-core/surefire-reports/index.html">CloudForge Core Test Reports</a></li>
                          </ul>
                      </div>

                      <!-- Validation Reports Card -->
                      <div class="card">
                          <div class="card-icon">✅</div>
                          <h2>Validation Reports</h2>
                          <p>CFC configuration validation results and truth tables</p>
                          <ul>
                              <li><a href="validation/truth-table.json">Truth Table (JSON)</a></li>
                              <li><a href="validation/truth-table-report.html">Truth Table (HTML)</a></li>
                              <li><a href="validation/validation-run.log">Validation Log</a></li>
                              <li><a href="validation/compliance-truth-table-report.html">Compliance Truth Table (HTML)</a> <span class="badge badge-success">Auditor</span></li>
                              <li><a href="validation/compliance-truth-table.json">Compliance Truth Table (JSON)</a></li>
                              <li><a href="validation/comprehensive-synth-report.html">Comprehensive Synthesis Tests</a> <span class="badge badge-info">All Stacks</span></li>
                          </ul>
                      </div>

                      <!-- Drift Detection Card -->
                      <div class="card">
                          <div class="card-icon">🔍</div>
                          <h2>Drift Detection</h2>
                          <p>Infrastructure drift detection reports</p>
                          <ul>
                              <li><a href="drift/">Browse Drift Reports</a> <span class="badge badge-info">Beta</span></li>
                          </ul>
                      </div>

                      <!-- Security & SBOM Card -->
                      <div class="card">
                          <div class="card-icon">🔒</div>
                          <h2>Security & SBOM</h2>
                          <p>Software Bill of Materials and vulnerability scanning</p>
                          <ul>
                              <li><a href="sbom/cfc-core-sbom.json">SBOM (JSON)</a></li>
                              <li><a href="sbom/cfc-core-sbom.xml">SBOM (XML)</a></li>
                              <li><a href="sbom/dependency-check/dependency-check-report.html">Vulnerability Report (HTML)</a> <span class="badge badge-warning">Review</span></li>
                              <li><a href="sbom/dependency-check/dependency-check-report.json">Vulnerability Report (JSON)</a></li>
                          </ul>
                      </div>

                      <!-- Deployment Metrics Card -->
                      <div class="card">
                          <div class="card-icon">🚀</div>
                          <h2>Deployment Metrics</h2>
                          <p>Continuous deployment testing and performance tracking</p>
                          <ul>
                              <li><a href="deployment-metrics/">Deployment Dashboard</a> <span class="badge badge-info">Live</span></li>
                              <li><a href="deployment-metrics/data/deployment-metrics.csv">Metrics CSV</a></li>
                              <li><a href="deployment-metrics/data/latest-trends.md">Trends Report</a></li>
                          </ul>
                      </div>

                      <!-- Documentation Card -->
                      <div class="card">
                          <div class="card-icon">📚</div>
                          <h2>Documentation</h2>
                          <p>Project documentation and resources</p>
                          <ul>
                              <li><a href="https://github.com/CloudForgeCI/cfc-core">GitHub Repository</a></li>
                              <li><a href="https://github.com/CloudForgeCI/cfc-core/blob/develop/README.md">README</a></li>
                              <li><a href="https://github.com/CloudForgeCI/cfc-core/blob/develop/CONTRIBUTING.md">Contributing Guide</a></li>
                          </ul>
                      </div>
                  </div>

                  <div class="footer">
                      <p>
                          Generated by GitHub Actions |
                          <a href="https://github.com/CloudForgeCI/cfc-core/actions">View Workflow Runs</a>
                      </p>
                  </div>
              </div>

              <script>
                  // Set current timestamp
                  const now = new Date();
                  document.getElementById('timestamp').textContent = now.toUTCString();
              </script>
          </body>
          </html>
          EOF

          echo "✅ Generated index.html"

      - name: Generate coverage summary JSON
        run: |
          cat > github-pages-reports/coverage-summary.json << EOF
          {
            "generated": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "modules": []
          }
          EOF

          # Extract coverage percentages if available
          if [ -f "cloudforge-api/target/site/jacoco/index.html" ]; then
            API_COVERAGE=$(grep -o "Total[^%]*[0-9]\+%" cloudforge-api/target/site/jacoco/index.html | grep -o "[0-9]\+%" | head -1 || echo "N/A")
            echo "API Coverage: $API_COVERAGE"
          fi

          if [ -f "cloudforge-core/target/site/jacoco/index.html" ]; then
            CORE_COVERAGE=$(grep -o "Total[^%]*[0-9]\+%" cloudforge-core/target/site/jacoco/index.html | grep -o "[0-9]\+%" | head -1 || echo "N/A")
            echo "Core Coverage: $CORE_COVERAGE"
          fi

      - name: List generated reports
        run: |
          echo "Generated reports structure:"
          find github-pages-reports -type f | head -50

      - name: Download metrics dashboards artifact
        id: download-metrics
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: deployment-testing.yml
          name: metrics-dashboards
          path: ./downloaded-metrics
          if_no_artifact_found: warn
          allow_forks: false
          # Download from most recent successful workflow run
          workflow_conclusion: success
          # Search for artifacts from the last 30 days
          search_artifacts: true
        continue-on-error: true

      - name: Debug artifact download
        run: |
          echo "🔍 Artifact download status: ${{ steps.download-metrics.outcome }}"
          echo "📦 Checking if downloaded-metrics directory exists:"
          if [ -d "downloaded-metrics" ]; then
            echo "✅ downloaded-metrics directory exists"
            echo "📁 Contents:"
            find downloaded-metrics -type f -ls | head -50
          else
            echo "❌ downloaded-metrics directory not found"
            echo "⚠️  This is expected if no deployment tests have run yet"
            echo "Current directory contents:"
            find . -maxdepth 1 -type f -ls
          fi

      - name: Copy metrics dashboards to github-pages-reports
        run: |
          # Debug: Show what was downloaded
          echo "📦 Checking downloaded metrics structure:"
          ls -la downloaded-metrics/ 2>/dev/null || echo "No downloaded-metrics directory"
          find downloaded-metrics -type f 2>/dev/null | head -20 || echo "No files found"

          # Copy deployment metrics dashboard if it exists
          if [ -d "downloaded-metrics/deployment-metrics" ]; then
            mkdir -p github-pages-reports/deployment-metrics
            cp -r downloaded-metrics/deployment-metrics/* github-pages-reports/deployment-metrics/
            echo "✅ Copied deployment metrics dashboard from downloaded-metrics/deployment-metrics/"
          elif [ -d "deployment-metrics" ]; then
            # Fallback: check if artifact extracted to current directory
            mkdir -p github-pages-reports/deployment-metrics
            cp -r deployment-metrics/* github-pages-reports/deployment-metrics/
            echo "✅ Copied deployment metrics dashboard from deployment-metrics/ (fallback)"
          else
            echo "⚠️  No deployment metrics dashboard found - will show placeholder"
            # Create a placeholder directory
            mkdir -p github-pages-reports/deployment-metrics
          fi

          # Copy changeset validation dashboard if it exists
          if [ -d "downloaded-metrics/changeset-validation" ]; then
            mkdir -p github-pages-reports/changeset-validation
            cp -r downloaded-metrics/changeset-validation/* github-pages-reports/changeset-validation/
            echo "✅ Copied changeset validation dashboard from downloaded-metrics/changeset-validation/"
          elif [ -d "changeset-validation" ]; then
            # Fallback: check if artifact extracted to current directory
            mkdir -p github-pages-reports/changeset-validation
            cp -r changeset-validation/* github-pages-reports/changeset-validation/
            echo "✅ Copied changeset validation dashboard from changeset-validation/ (fallback)"
          else
            echo "⚠️  No changeset validation dashboard found - will show placeholder"
            # Create a placeholder directory
            mkdir -p github-pages-reports/changeset-validation
          fi

      - name: Create placeholder dashboards if missing
        run: |
          # Check if deployment metrics dashboard exists
          if [ ! -f "github-pages-reports/deployment-metrics/index.html" ]; then
            echo "Creating placeholder deployment metrics dashboard..."
            mkdir -p github-pages-reports/deployment-metrics/data

            # Create empty CSV with headers
            cat > github-pages-reports/deployment-metrics/data/deployment-metrics.csv << 'EOF'
          RunID,Timestamp,StackName,Runtime,SecurityProfile,AuthMode,NetworkMode,ComplianceFrameworks,SynthTime,AnalysisTime,ResourceCount,Status,ErrorMessage
          EOF

            # Create placeholder trends
            echo "No deployment test data available yet. Dashboards will populate after the first deployment test run." > github-pages-reports/deployment-metrics/data/latest-trends.md

            # Create simple placeholder HTML
            cat > github-pages-reports/deployment-metrics/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Deployment Metrics - Coming Soon</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      min-height: 100vh;
                      margin: 0;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white;
                      text-align: center;
                      padding: 20px;
                  }
                  .container { max-width: 600px; }
                  h1 { font-size: 3em; margin-bottom: 20px; }
                  p { font-size: 1.2em; line-height: 1.6; }
                  a { color: white; text-decoration: underline; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Deployment Metrics Dashboard</h1>
                  <p>Deployment testing metrics will appear here after the first scheduled deployment test runs.</p>
                  <p><a href="../index.html">← Back to Reports Dashboard</a></p>
              </div>
          </body>
          </html>
          EOF

            echo "✅ Created placeholder deployment metrics dashboard"
          fi

          # Check if changeset validation dashboard exists
          if [ ! -f "github-pages-reports/changeset-validation/index.html" ]; then
            echo "Creating placeholder changeset validation dashboard..."
            mkdir -p github-pages-reports/changeset-validation/data

            # Create empty CSV with headers
            cat > github-pages-reports/changeset-validation/data/changeset-metrics.csv << 'EOF'
          RunID,Timestamp,StackName,Runtime,SecurityProfile,AuthMode,NetworkMode,ComplianceFrameworks,SynthTime,ChangesetTime,TotalChanges,ResourcesAdded,ResourcesModified,ResourcesRemoved,Status,ErrorMessage
          EOF

            # Create placeholder trends
            echo "No changeset validation data available yet. Dashboards will populate after the first changeset validation run." > github-pages-reports/changeset-validation/data/latest-trends.md

            # Create simple placeholder HTML
            cat > github-pages-reports/changeset-validation/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Changeset Validation - Coming Soon</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      min-height: 100vh;
                      margin: 0;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white;
                      text-align: center;
                      padding: 20px;
                  }
                  .container { max-width: 600px; }
                  h1 { font-size: 3em; margin-bottom: 20px; }
                  p { font-size: 1.2em; line-height: 1.6; }
                  a { color: white; text-decoration: underline; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Changeset Validation Dashboard</h1>
                  <p>Changeset validation metrics will appear here after the first validation run with AWS credentials.</p>
                  <p><a href="../index.html">← Back to Reports Dashboard</a></p>
              </div>
          </body>
          </html>
          EOF

            echo "✅ Created placeholder changeset validation dashboard"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'github-pages-reports'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report-deployment:
    name: Report Deployment Status
    needs: build-reports
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate deployment summary
        run: |
          echo "## 📊 Reports Published to GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Status:** ${{ needs.build-reports.result == 'success' && '✅ Success' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Reports Dashboard](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)" >> $GITHUB_STEP_SUMMARY
          echo "- [API Coverage Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/coverage/cloudforge-api/)" >> $GITHUB_STEP_SUMMARY
          echo "- [Core Coverage Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/coverage/cloudforge-core/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Available Reports" >> $GITHUB_STEP_SUMMARY
          echo "- Code Coverage (JaCoCo)" >> $GITHUB_STEP_SUMMARY
          echo "- Validation Reports" >> $GITHUB_STEP_SUMMARY
          echo "- Drift Detection" >> $GITHUB_STEP_SUMMARY
