name: Publish Reports to GitHub Pages

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-reports:
    name: Build and Aggregate Reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download existing GitHub Pages history
        run: |
          set -x  # Enable debug logging
          echo "📥 Downloading existing GitHub Pages history folder..."
          mkdir -p github-pages-reports/history

          # Base URL for GitHub Pages
          PAGES_BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          PAGES_URL="${PAGES_BASE_URL}/history"
          echo "🔗 Pages URL: ${PAGES_URL}"

          # Get today's date to skip downloading it (we'll create it fresh)
          TODAY=$(date +'%Y-%m-%d')
          echo "📅 Today's date: ${TODAY}"

          # Try to fetch the history index to see if it exists
          if curl -f -s "${PAGES_URL}/index.html" > /dev/null 2>&1; then
            echo "✅ Found existing history, downloading..."

            # Download history index to get list of dates
            curl -s "${PAGES_URL}/index.html" -o /tmp/history-index.html

            # Extract date folders (format: YYYY-MM-DD) from the HTML
            echo "📋 Extracting available historical dates..."
            DATES=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' /tmp/history-index.html | sort -u)
            echo "Found dates: ${DATES}"

            echo "${DATES}" | while read -r date; do
              # Skip today's date - we'll create it fresh with new reports
              if [ "$date" = "$TODAY" ]; then
                echo "  ⏭️  Skipping ${date} (will be created fresh with new reports)"
                continue
              fi

              echo "  📁 Downloading history for ${date}..."
              mkdir -p "github-pages-reports/history/${date}"

              # Try to download manifest file first (preferred method)
              if curl -f -s "${PAGES_URL}/${date}/manifest.txt" -o /tmp/manifest-${date}.txt 2>/dev/null; then
                echo "    📋 Found manifest.txt, downloading files from manifest..."
                FILE_COUNT=0

                while IFS= read -r filepath || [ -n "$filepath" ]; do
                  # Skip empty lines
                  [ -z "$filepath" ] && continue

                  # Create directory structure and download file
                  mkdir -p "github-pages-reports/history/${date}/$(dirname "$filepath")"
                  if curl -f -s "${PAGES_URL}/${date}/${filepath}" -o "github-pages-reports/history/${date}/${filepath}" 2>/dev/null; then
                    FILE_COUNT=$((FILE_COUNT + 1))
                  fi
                done < /tmp/manifest-${date}.txt

                echo "    ✅ Downloaded ${FILE_COUNT} files from manifest"
              else
                echo "    ⚠️  No manifest.txt found, falling back to known subdirectories..."

                # Fallback: Download each subdirectory index and key files
                for subdir in coverage validation drift sbom deployment-metrics changeset-validation; do
                  # Try to download the index file to check if subdir exists
                  if curl -f -s "${PAGES_URL}/${date}/${subdir}/index.html" > /dev/null 2>&1; then
                    echo "    ↓ ${subdir}/"
                    mkdir -p "github-pages-reports/history/${date}/${subdir}"

                    # Download index.html for this subdir
                    curl -s "${PAGES_URL}/${date}/${subdir}/index.html" \
                      -o "github-pages-reports/history/${date}/${subdir}/index.html" 2>/dev/null || true

                    # Download known important files for each subdir type
                    case "$subdir" in
                      validation)
                        for file in truth-table.json truth-table-report.html compliance-truth-table.json \
                                    compliance-truth-table-report.html compliance-validation-dashboard.html \
                                    compliance-validation-results.json comprehensive-synth-report.html; do
                          curl -f -s "${PAGES_URL}/${date}/${subdir}/${file}" \
                            -o "github-pages-reports/history/${date}/${subdir}/${file}" 2>/dev/null || true
                        done
                        # Download cfn-templates directory if exists
                        mkdir -p "github-pages-reports/history/${date}/${subdir}/cfn-templates"
                        ;;
                      coverage)
                        for module in cloudforge-api cloudforge-core; do
                          mkdir -p "github-pages-reports/history/${date}/${subdir}/${module}"
                          curl -f -s "${PAGES_URL}/${date}/${subdir}/${module}/index.html" \
                            -o "github-pages-reports/history/${date}/${subdir}/${module}/index.html" 2>/dev/null || true
                        done
                        ;;
                      sbom)
                        for file in cfc-core-sbom.json cfc-core-sbom.xml; do
                          curl -f -s "${PAGES_URL}/${date}/${subdir}/${file}" \
                            -o "github-pages-reports/history/${date}/${subdir}/${file}" 2>/dev/null || true
                        done
                        mkdir -p "github-pages-reports/history/${date}/${subdir}/dependency-check"
                        for file in dependency-check-report.html dependency-check-report.json dependency-check-report.xml; do
                          curl -f -s "${PAGES_URL}/${date}/${subdir}/dependency-check/${file}" \
                            -o "github-pages-reports/history/${date}/${subdir}/dependency-check/${file}" 2>/dev/null || true
                        done
                        ;;
                    esac
                  else
                    echo "    ⊘ ${subdir}/ (not found)"
                  fi
                done
              fi

              # Download the date's index.html
              curl -s "${PAGES_URL}/${date}/index.html" \
                -o "github-pages-reports/history/${date}/index.html" 2>/dev/null || true

              echo "  ✅ Completed download for ${date}"
            done

            # Download history index.html
            curl -s "${PAGES_URL}/index.html" \
              -o "github-pages-reports/history/index.html" 2>/dev/null || true

            echo "✅ Downloaded existing history (excluding today's date)"
            echo "📊 Final structure:"
            find github-pages-reports/history -type d -name "20*" | sort
          else
            echo "ℹ️  No existing history found (this may be the first run)"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-pip
          pip3 install --upgrade pip

      - name: Install AWS CDK
        run: |
          npm install -g aws-cdk
          cdk --version

      - name: Cache cfn-guard binary
        id: cache-cfn-guard
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/cfn-guard
          key: cfn-guard-v3.1.1-${{ runner.os }}-sha256-106db0d9

      - name: Install CloudFormation Guard (cfn-guard)
        if: steps.cache-cfn-guard.outputs.cache-hit != 'true'
        run: |
          echo "Installing CloudFormation Guard for Layer 3 template validation..."
          CFN_GUARD_VERSION="3.1.1"
          CFN_GUARD_TARBALL="cfn-guard-v3-ubuntu-latest.tar.gz"
          CFN_GUARD_SHA256="106db0d9fcbd11605349dd650145ac148a0c10e2c0b4d6f45898f222f3ae473b"

          # Download cfn-guard
          wget -q "https://github.com/aws-cloudformation/cloudformation-guard/releases/download/${CFN_GUARD_VERSION}/${CFN_GUARD_TARBALL}"

          # Verify SHA256 checksum
          echo "${CFN_GUARD_SHA256}  ${CFN_GUARD_TARBALL}" | sha256sum -c -
          if [ $? -ne 0 ]; then
            echo "❌ SHA256 checksum verification failed!"
            exit 1
          fi
          echo "✅ SHA256 checksum verified"

          # Extract and install
          tar -xzf "${CFN_GUARD_TARBALL}"
          sudo mv cfn-guard-v3-ubuntu-latest/cfn-guard /usr/local/bin/
          cfn-guard --version
          echo "✅ cfn-guard installed successfully"

      - name: Verify cfn-guard installation
        run: |
          cfn-guard --version
          echo "✅ cfn-guard ready"

      - name: Get current date for cache key
        id: date
        run: echo "date=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials (for CDK synth only)
        env:
          MOCK_AWS_ACCESS_KEY_ID: ${{ secrets.MOCK_AWS_ACCESS_KEY_ID }}
          MOCK_AWS_SECRET_ACCESS_KEY: ${{ secrets.MOCK_AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id = ${MOCK_AWS_ACCESS_KEY_ID}
          aws_secret_access_key = ${MOCK_AWS_SECRET_ACCESS_KEY}
          EOF
          cat > ~/.aws/config << EOF
          [default]
          region = us-east-1
          output = json
          EOF

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache OWASP Dependency-Check NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/dependency-check-data
          # Cache key based on year-week (YYYY-WW) - updates weekly for fresh CVE data
          # This prevents re-downloading the ~1GB NVD database on every run
          key: ${{ runner.os }}-dependency-check-v12-${{ steps.date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-v12-

      - name: Build and test with coverage
        run: |
          echo "Building project with tests and coverage..."
          mvn clean install -B -V
          echo "Build complete"

      - name: Generate surefire HTML reports
        run: |
          echo "Generating surefire HTML reports..."
          mvn surefire-report:report -B
          echo "Surefire HTML reports generated"

      - name: Generate aggregated JavaDoc
        run: |
          echo "Generating aggregated JavaDoc for all modules..."
          mvn javadoc:aggregate -B
          echo "JavaDoc generated at target/site/apidocs"

      - name: Set up Node.js for Docusaurus
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/web/package-lock.json

      - name: Build Docusaurus documentation
        run: |
          echo "Installing Docusaurus dependencies..."
          cd docs/web
          npm ci
          echo "Building Docusaurus site..."
          npm run build
          echo "Docusaurus build complete at docs/web/build"

      - name: Prepare CDK dependencies for validation
        run: |
          cd cfc-testing
          echo "Ensuring clean build of cfc-testing module for synthesis tests..."
          echo "This ensures all latest changes from cloudforge-core are picked up"
          mvn clean package -DskipTests -B
          chmod +x scripts/*.sh 2>/dev/null || true
          mkdir -p scripts/validation-results scripts/synth-results

      - name: Run CFC validation (full mode for GitHub Pages)
        run: |
          set -o pipefail
          cd cfc-testing
          echo "Running full validation to generate truth tables for GitHub Pages..."
          bash scripts/master-validation-system.sh full 2>&1 | tee validation-run.log

      - name: Generate compliance truth table reports
        run: |
          set -o pipefail
          cd cfc-testing/scripts
          echo "Generating compliance truth table reports..."
          echo "1️⃣ Running compliance tests and generating multi-layer validation dashboard..."
          python3 compliance-report-generator.py 2>&1 | tee compliance-report.log
          echo "2️⃣ Generating truth table and test matrix from test results..."
          python3 truth-table-generator.py 2>&1 | tee truth-table-validation.log
          echo "3️⃣ Generating comprehensive FrameworkRules unit test report..."
          python3 compliance-truth-table-generator.py 2>&1 | tee compliance-truth-table.log
          echo "✅ Compliance truth table generation complete"

      - name: Run comprehensive synthesis tests
        run: |
          set -o pipefail
          cd cfc-testing
          echo "Running comprehensive synthesis tests..."
          bash scripts/comprehensive-synth-test.sh 2>&1 | tee comprehensive-synth.log
          echo "✅ Comprehensive synthesis tests complete"

      - name: Generate synthesis test HTML report
        run: |
          cd cfc-testing/scripts
          echo "Generating synthesis test HTML report..."
          bash generate-synth-report.sh
          echo "✅ Synthesis report generation complete"

      - name: Capture build snapshot
        run: |
          set -o pipefail
          cd cfc-testing
          echo "Capturing build snapshot for progression tracking..."
          bash scripts/capture-build-snapshot.sh 2>&1 | tee scripts/validation-results/build-snapshot.log
          echo "✅ Build snapshot captured"

      - name: Create reports directory structure
        run: |
          mkdir -p github-pages-reports/{coverage,validation,drift,sbom}
          echo "Reports directory created"

      - name: Copy coverage reports
        run: |
          echo "Copying coverage reports..."

          # Copy API coverage
          if [ -d "cloudforge-api/target/site/jacoco" ]; then
            mkdir -p github-pages-reports/coverage/cloudforge-api
            cp -r cloudforge-api/target/site/jacoco/* github-pages-reports/coverage/cloudforge-api/
            echo "✅ Copied cloudforge-api coverage"
          fi

          # Copy Core coverage
          if [ -d "cloudforge-core/target/site/jacoco" ]; then
            mkdir -p github-pages-reports/coverage/cloudforge-core
            cp -r cloudforge-core/target/site/jacoco/* github-pages-reports/coverage/cloudforge-core/
            echo "✅ Copied cloudforge-core coverage"
          fi

      - name: Copy surefire test reports
        run: |
          echo "Copying surefire HTML test reports..."

          # Copy API surefire HTML reports (generated by maven-surefire-report-plugin in target/reports/)
          if [ -d "cloudforge-api/target/reports" ]; then
            mkdir -p github-pages-reports/coverage/cloudforge-api/surefire-reports
            cp -r cloudforge-api/target/reports/* github-pages-reports/coverage/cloudforge-api/surefire-reports/
            echo "✅ Copied cloudforge-api surefire HTML reports"
          fi

          # Copy Core surefire HTML reports (generated by maven-surefire-report-plugin in target/reports/)
          if [ -d "cloudforge-core/target/reports" ]; then
            mkdir -p github-pages-reports/coverage/cloudforge-core/surefire-reports
            cp -r cloudforge-core/target/reports/* github-pages-reports/coverage/cloudforge-core/surefire-reports/
            echo "✅ Copied cloudforge-core surefire HTML reports"
          fi

      - name: Copy validation reports
        run: |
          echo "Copying validation reports..."

          if [ -d "cfc-testing/scripts/validation-results" ]; then
            cp -r cfc-testing/scripts/validation-results/* github-pages-reports/validation/ 2>/dev/null || true
            echo "✅ Copied validation results"
          fi

          if [ -f "cfc-testing/validation-run.log" ]; then
            cp cfc-testing/validation-run.log github-pages-reports/validation/
            echo "✅ Copied validation log"
          fi

          if [ -f "cfc-testing/comprehensive-synth.log" ]; then
            cp cfc-testing/comprehensive-synth.log github-pages-reports/validation/
            echo "✅ Copied comprehensive synthesis log"
          fi

      - name: Copy cdk-nag compliance reports
        run: |
          echo "Copying cdk-nag compliance reports..."
          mkdir -p github-pages-reports/validation/cdk-nag

          # Copy cdk-nag NagReport files (JSON and CSV)
          if [ -d "cfc-testing/cdk.out" ]; then
            find cfc-testing/cdk.out -name "*-NagReport.json" -exec cp {} github-pages-reports/validation/cdk-nag/ \; 2>/dev/null || true
            find cfc-testing/cdk.out -name "*-NagReport.csv" -exec cp {} github-pages-reports/validation/cdk-nag/ \; 2>/dev/null || true

            JSON_COUNT=$(find github-pages-reports/validation/cdk-nag -name "*.json" 2>/dev/null | wc -l)
            CSV_COUNT=$(find github-pages-reports/validation/cdk-nag -name "*.csv" 2>/dev/null | wc -l)

            if [ "$JSON_COUNT" -gt 0 ] || [ "$CSV_COUNT" -gt 0 ]; then
              echo "✅ Copied cdk-nag reports: ${JSON_COUNT} JSON, ${CSV_COUNT} CSV"
            else
              echo "ℹ️  No cdk-nag reports found in cdk.out"
            fi
          else
            echo "ℹ️  cdk.out directory not found"
          fi

      - name: Copy drift reports
        run: |
          echo "Copying drift reports..."

          if [ -d "cfc-testing/scripts/validation-results/drift-reports" ]; then
            cp -r cfc-testing/scripts/validation-results/drift-reports/* github-pages-reports/drift/ 2>/dev/null || true
            echo "✅ Copied drift reports"
          fi

          # Also copy the drift-report.txt if it exists
          if [ -f "cfc-testing/scripts/validation-results/drift-report.txt" ]; then
            cp cfc-testing/scripts/validation-results/drift-report.txt github-pages-reports/drift/
            echo "✅ Copied drift-report.txt"
          fi

          # Copy build snapshots for drift tracking
          mkdir -p github-pages-reports/drift/snapshots
          if [ -d "cfc-testing/scripts/validation-results/snapshots" ]; then
            cp -r cfc-testing/scripts/validation-results/snapshots/* github-pages-reports/drift/snapshots/ 2>/dev/null || true
            echo "✅ Copied build snapshots"
          fi

          # Copy latest snapshot as current-snapshot.json for easy access
          if [ -f "cfc-testing/scripts/validation-results/snapshots/latest-snapshot.json" ]; then
            cp "$(readlink -f cfc-testing/scripts/validation-results/snapshots/latest-snapshot.json)" github-pages-reports/drift/current-snapshot.json 2>/dev/null || true
            echo "✅ Copied current snapshot"
          fi

      - name: Generate drift report index
        run: |
          cat > github-pages-reports/drift/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Drift Detection & Build Snapshots</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      padding: 20px;
                  }
                  .container { max-width: 1400px; margin: 0 auto; }
                  .header {
                      text-align: center;
                      color: white;
                      padding: 40px 20px;
                  }
                  .header h1 { font-size: 2.5em; margin-bottom: 10px; }
                  .content {
                      background: white;
                      border-radius: 12px;
                      padding: 30px;
                      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                      margin-bottom: 20px;
                  }
                  .tabs {
                      display: flex;
                      gap: 10px;
                      margin-bottom: 20px;
                      border-bottom: 2px solid #e1e4e8;
                      padding-bottom: 10px;
                  }
                  .tab {
                      padding: 10px 20px;
                      background: #f6f8fa;
                      border: none;
                      border-radius: 6px 6px 0 0;
                      cursor: pointer;
                      font-size: 1em;
                      transition: all 0.2s;
                  }
                  .tab:hover { background: #e1e4e8; }
                  .tab.active { background: #667eea; color: white; }
                  .tab-content { display: none; }
                  .tab-content.active { display: block; }
                  pre {
                      background: #f6f8fa;
                      padding: 20px;
                      border-radius: 6px;
                      overflow-x: auto;
                      font-size: 0.9em;
                      line-height: 1.6;
                  }
                  .back-link {
                      display: inline-block;
                      margin-bottom: 20px;
                      color: #667eea;
                      text-decoration: none;
                      font-weight: 500;
                  }
                  .back-link:hover { text-decoration: underline; }
                  .stats-grid {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                      gap: 20px;
                      margin-bottom: 30px;
                  }
                  .stat-card {
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white;
                      padding: 20px;
                      border-radius: 10px;
                      text-align: center;
                  }
                  .stat-card h3 { font-size: 2em; margin-bottom: 5px; }
                  .stat-card p { opacity: 0.9; }
                  .info-grid {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                      gap: 20px;
                      margin-bottom: 30px;
                  }
                  .info-card {
                      background: #f6f8fa;
                      padding: 20px;
                      border-radius: 8px;
                      border-left: 4px solid #667eea;
                  }
                  .info-card h4 { margin-bottom: 10px; color: #24292e; }
                  .info-card ul { list-style: none; }
                  .info-card li { padding: 5px 0; color: #586069; }
                  .info-card li strong { color: #24292e; }
                  table {
                      width: 100%;
                      border-collapse: collapse;
                      margin-top: 15px;
                  }
                  th, td {
                      padding: 12px;
                      text-align: left;
                      border-bottom: 1px solid #e1e4e8;
                  }
                  th { background: #f6f8fa; font-weight: 600; }
                  .pass { color: #28a745; }
                  .fail { color: #dc3545; }
                  .badge {
                      display: inline-block;
                      padding: 4px 8px;
                      border-radius: 12px;
                      font-size: 0.8em;
                      font-weight: 500;
                  }
                  .badge-success { background: #28a745; color: white; }
                  .badge-danger { background: #dc3545; color: white; }
                  .badge-info { background: #17a2b8; color: white; }
                  .snapshot-list { margin-top: 20px; }
                  .snapshot-item {
                      background: #f6f8fa;
                      padding: 15px;
                      margin-bottom: 10px;
                      border-radius: 6px;
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                  }
                  .snapshot-item a { color: #667eea; text-decoration: none; }
                  .snapshot-item a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h1>🔍 Drift Detection & Build Snapshots</h1>
                      <p>Infrastructure Validation & Progression Tracking</p>
                  </div>
                  <div class="content">
                      <a href="../index.html" class="back-link">← Back to Dashboard</a>

                      <div class="tabs">
                          <button class="tab active" onclick="showTab('snapshot')">📸 Build Snapshot</button>
                          <button class="tab" onclick="showTab('drift')">📊 Drift Report</button>
                          <button class="tab" onclick="showTab('history')">📜 Snapshot History</button>
                      </div>

                      <div id="snapshot-tab" class="tab-content active">
                          <h2>Current Build Snapshot</h2>
                          <div id="snapshot-summary">Loading snapshot data...</div>
                      </div>

                      <div id="drift-tab" class="tab-content">
                          <h2>Drift Report</h2>
                          <pre id="report-content">Loading...</pre>
                      </div>

                      <div id="history-tab" class="tab-content">
                          <h2>Snapshot History</h2>
                          <div id="snapshot-history" class="snapshot-list">Loading history...</div>
                      </div>
                  </div>
              </div>
              <script>
                  function showTab(tabName) {
                      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                      document.querySelector(`[onclick="showTab('${tabName}')"]`).classList.add('active');
                      document.getElementById(`${tabName}-tab`).classList.add('active');
                  }

                  // Load drift report
                  fetch('drift-report.txt')
                      .then(response => response.text())
                      .then(text => {
                          document.getElementById('report-content').textContent = text || 'No drift report available';
                      })
                      .catch(err => {
                          document.getElementById('report-content').textContent = 'No drift report available';
                      });

                  // Load current snapshot
                  fetch('current-snapshot.json')
                      .then(response => response.json())
                      .then(data => {
                          const meta = data.snapshot_metadata || {};
                          const testMatrix = data.test_matrix || {};
                          const complexity = data.configuration_complexity || {};
                          const byProfile = testMatrix.by_security_profile || {};
                          const byRuntime = testMatrix.by_runtime || {};
                          const byNetwork = testMatrix.by_network_mode || {};
                          const byFramework = testMatrix.by_framework || {};

                          let html = `
                              <div class="stats-grid">
                                  <div class="stat-card">
                                      <h3>${testMatrix.total_tests || 0}</h3>
                                      <p>Total Tests</p>
                                  </div>
                                  <div class="stat-card" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%);">
                                      <h3>${testMatrix.passed || 0}</h3>
                                      <p>Passed</p>
                                  </div>
                                  <div class="stat-card" style="background: linear-gradient(135deg, #dc3545 0%, #fd7e14 100%);">
                                      <h3>${testMatrix.failed || 0}</h3>
                                      <p>Failed</p>
                                  </div>
                                  <div class="stat-card" style="background: linear-gradient(135deg, #17a2b8 0%, #6f42c1 100%);">
                                      <h3>${Object.keys(data.templates || {}).length}</h3>
                                      <p>Templates</p>
                                  </div>
                              </div>

                              <div class="info-grid">
                                  <div class="info-card">
                                      <h4>📋 Build Metadata</h4>
                                      <ul>
                                          <li><strong>Date:</strong> ${meta.build_date || 'N/A'} ${meta.build_time || ''}</li>
                                          <li><strong>Version:</strong> ${meta.version || 'N/A'}</li>
                                          <li><strong>Branch:</strong> ${meta.git_branch || 'N/A'}</li>
                                          <li><strong>Commit:</strong> ${meta.git_short_commit || 'N/A'}</li>
                                      </ul>
                                  </div>
                                  <div class="info-card">
                                      <h4>🎯 By Security Profile</h4>
                                      <ul>
                                          ${Object.entries(byProfile).map(([profile, stats]) =>
                                              `<li><strong>${profile}:</strong> ${stats.passed}/${stats.total} passed</li>`
                                          ).join('')}
                                      </ul>
                                  </div>
                                  <div class="info-card">
                                      <h4>⚙️ By Runtime</h4>
                                      <ul>
                                          ${Object.entries(byRuntime).map(([runtime, stats]) =>
                                              `<li><strong>${runtime}:</strong> ${stats.passed}/${stats.total} passed</li>`
                                          ).join('')}
                                      </ul>
                                  </div>
                                  <div class="info-card">
                                      <h4>🔧 Configuration Complexity</h4>
                                      <ul>
                                          <li><strong>Minimal:</strong> ${complexity.minimal_configs || 0}</li>
                                          <li><strong>With Domain:</strong> ${complexity.with_domain || 0}</li>
                                          <li><strong>With SSL:</strong> ${complexity.with_ssl || 0}</li>
                                          <li><strong>With WAF:</strong> ${complexity.with_waf || 0}</li>
                                      </ul>
                                  </div>
                                  <div class="info-card">
                                      <h4>📋 By Compliance Framework</h4>
                                      <ul>
                                          ${Object.entries(byFramework).map(([framework, stats]) =>
                                              `<li><strong>${framework}:</strong> ${stats.passed}/${stats.total} passed</li>`
                                          ).join('')}
                                      </ul>
                                  </div>
                                  <div class="info-card">
                                      <h4>🌐 By Network Mode</h4>
                                      <ul>
                                          ${Object.entries(byNetwork).map(([network, stats]) =>
                                              `<li><strong>${network}:</strong> ${stats.passed}/${stats.total} passed</li>`
                                          ).join('')}
                                      </ul>
                                  </div>
                              </div>

                              <h3>Templates</h3>
                              <table>
                                  <thead>
                                      <tr><th>Template</th><th>Resources</th><th>Hash</th></tr>
                                  </thead>
                                  <tbody>
                                      ${Object.entries(data.templates || {}).map(([name, info]) =>
                                          `<tr>
                                              <td>${name}</td>
                                              <td>${info.resource_count || 0}</td>
                                              <td><code>${(info.template_hash || '').substring(0, 12)}...</code></td>
                                          </tr>`
                                      ).join('')}
                                  </tbody>
                              </table>
                          `;
                          document.getElementById('snapshot-summary').innerHTML = html;
                      })
                      .catch(err => {
                          document.getElementById('snapshot-summary').innerHTML = `
                              <div class="info-card">
                                  <h4>No Snapshot Data</h4>
                                  <p>Build snapshot not available. Run capture-build-snapshot.sh to generate.</p>
                              </div>
                          `;
                      });

                  // Load snapshot history
                  fetch('snapshots/')
                      .then(response => response.text())
                      .then(html => {
                          const parser = new DOMParser();
                          const doc = parser.parseFromString(html, 'text/html');
                          const links = Array.from(doc.querySelectorAll('a'))
                              .filter(a => a.href.includes('snapshot-') && a.href.endsWith('.json'))
                              .map(a => a.textContent.trim());

                          if (links.length > 0) {
                              const historyHtml = links.reverse().map(file =>
                                  `<div class="snapshot-item">
                                      <span>${file}</span>
                                      <a href="snapshots/${file}" download>Download</a>
                                  </div>`
                              ).join('');
                              document.getElementById('snapshot-history').innerHTML = historyHtml;
                          } else {
                              document.getElementById('snapshot-history').innerHTML = '<p>No snapshot history available.</p>';
                          }
                      })
                      .catch(err => {
                          document.getElementById('snapshot-history').innerHTML = '<p>No snapshot history available.</p>';
                      });
              </script>
          </body>
          </html>
          EOF
          echo "✅ Generated drift report index"

      - name: Generate dependency-check reports
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
          OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}
        run: |
          echo "Generating OWASP Dependency-Check reports..."

          # Configure OSS Index credentials if available
          if [ -n "$OSSINDEX_USERNAME" ] && [ -n "$OSSINDEX_TOKEN" ]; then
            mkdir -p ~/.m2
            cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>ossindex</id>
                <username>${OSSINDEX_USERNAME}</username>
                <password>${OSSINDEX_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
            echo "✅ Configured OSS Index credentials"
          else
            echo "⚠️  OSS Index credentials not available"
          fi

          # First, update the NVD database (required when autoUpdate=false in pom.xml)
          echo "Updating NVD database..."
          mvn dependency-check:update-only -Psecurity-scan || {
            echo "⚠️  NVD database update had issues, proceeding anyway..."
          }

          # Run dependency check with aggregate goal for multi-module project
          EXIT_CODE=0
          mvn dependency-check:aggregate -Psecurity-scan -e || EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            echo "⚠️  Dependency check exited with code $EXIT_CODE"
            echo "Attempting to list any partial reports that may have been generated..."
            find . -name "dependency-check-report.*" -type f 2>/dev/null || echo "No dependency-check files found"
          fi

          # Clean up credentials file (extra safety, runner is ephemeral anyway)
          rm -f ~/.m2/settings.xml

          # Check what reports were actually generated
          echo "Checking generated dependency-check reports:"
          echo "Searching in all target directories..."
          find . -name "dependency-check-report.*" -type f -ls 2>/dev/null || true

          # Look for reports in root target (expected with aggregate=true)
          if [ -f "target/dependency-check-report.html" ]; then
            echo "✅ HTML report generated: $(ls -lh target/dependency-check-report.html | awk '{print $5}')"
          else
            echo "❌ HTML report NOT found in target/"
          fi

          if [ -f "target/dependency-check-report.json" ]; then
            echo "✅ JSON report generated: $(ls -lh target/dependency-check-report.json | awk '{print $5}')"
          else
            echo "❌ JSON report NOT found in target/"
          fi

          if [ -f "target/dependency-check-report.xml" ]; then
            echo "✅ XML report generated: $(ls -lh target/dependency-check-report.xml | awk '{print $5}')"
          else
            echo "❌ XML report NOT found in target/"
          fi

          echo "✅ Dependency-Check step completed"

      - name: Copy SBOM and security reports
        run: |
          echo "Copying SBOM and security reports..."

          # Copy SBOM files
          if [ -f "target/cfc-core-sbom.json" ]; then
            cp target/cfc-core-sbom.json github-pages-reports/sbom/
            echo "✅ Copied SBOM JSON"
          else
            echo "⚠️  SBOM JSON not found (expected at target/cfc-core-sbom.json)"
          fi

          if [ -f "target/cfc-core-sbom.xml" ]; then
            cp target/cfc-core-sbom.xml github-pages-reports/sbom/
            echo "✅ Copied SBOM XML"
          else
            echo "⚠️  SBOM XML not found (expected at target/cfc-core-sbom.xml)"
          fi

          # Copy dependency-check reports
          mkdir -p github-pages-reports/sbom/dependency-check

          # Function to find and copy a report file
          copy_dependency_report() {
            local format=$1
            local filename="dependency-check-report.${format}"

            # First try root target (expected with aggregate=true)
            if [ -f "target/${filename}" ]; then
              cp "target/${filename}" github-pages-reports/sbom/dependency-check/
              echo "✅ Copied dependency-check ${format^^} report from target/"
            else
              # Search in all target directories
              local found_file=$(find . -name "${filename}" -type f -print -quit 2>/dev/null)
              if [ -n "$found_file" ]; then
                cp "$found_file" github-pages-reports/sbom/dependency-check/
                echo "✅ Copied dependency-check ${format^^} report from ${found_file}"
              else
                echo "⚠️  Dependency-check ${format^^} report not found - will not be available on GitHub Pages"
              fi
            fi
          }

          copy_dependency_report "html"
          copy_dependency_report "json"
          copy_dependency_report "xml"

      - name: Copy Docusaurus documentation
        run: |
          echo "Copying Docusaurus documentation..."

          if [ -d "docs/web/build" ]; then
            mkdir -p github-pages-reports/documentation
            cp -r docs/web/build/* github-pages-reports/documentation/
