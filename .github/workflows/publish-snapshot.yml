name: Publish Snapshot

# Continuous delivery for cfc-core's OSS deployment library (cfc-core's own root/BOM pom,
# cloudforge-core, cloudforge-api). The pom.xml always carries a -SNAPSHOT version on develop --
# real releases no longer happen here. A real release comes from a dedicated, frozen
# release/vX.Y.Z branch instead: cut-release.yml cuts one from develop on demand, and
# publish-release-branch.yml publishes it. See those two workflows for that flow; the only thing
# that still changes develop's <version> is cut-release.yml bumping past the minor it just cut.
#
# cloudforge-ministack and cloudforge-localstack are not published here: each lives in its own
# repo (CloudForgeCI/cloudforge-ministack, CloudForgeCI/cloudforge-localstack), declares this
# pom as its Maven parent, and publishes independently in lockstep with this pom's version --
# see their own repos' sync-versions.yml/publish-maven-central.yml.
#
# cloudforge-synth-service is not published here either; see publish-release-branch.yml's header.
#
#   1. build-test       — full build + test. Nothing downstream runs unless this passes.
#   2. publish-snapshot — deploys the current -SNAPSHOT version to Central Portal's snapshots
#      repository (https://central.sonatype.com/repository/maven-snapshots/), so
#      cloudforge-manager-deployment/cloudforge-manager can resolve it in their own CI. Runs when a
#      pull request against develop is opened or updated, so a snapshot is available downstream
#      during review rather than only after merge, and again on every push to develop.
#
# Required repo secrets (same four already configured for publish-release-branch.yml):
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE, CENTRAL_PORTAL_USERNAME, CENTRAL_PORTAL_PASSWORD

on:
  pull_request:
    branches: [ develop ] # snapshot as soon as a PR targeting develop is opened/updated
    types: [ opened, synchronize, reopened ]
    paths:
      - 'pom.xml'
      - 'cloudforge-core/**'
      - 'cloudforge-api/**'
      - '.github/workflows/publish-snapshot.yml'
  push:
    branches: [ develop ] # release on every push to develop (normally a PR merge). No path
                           # filter on purpose: the safety gate below (root pom's <version> not
                           # already tagged) decides whether a run does anything, and a path filter
                           # would only risk skipping a release.
  workflow_dispatch: {}

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        run: mvn -B -Pci -pl .,cloudforge-core,cloudforge-api -am clean verify

  publish-snapshot:
    name: Publish SNAPSHOT to Central
    # macOS, not Linux: on GitHub's Linux runners gpg-agent fails with "Too much data for IPC
    # layer" when signing, independent of GnuPG build (system 2.4.4, Homebrew 2.5.x), plugin
    # version, key, homedir/pinentry/passphrase configuration, or running inside a container
    # (containers share the runner's kernel). macOS runners are not affected.
    runs-on: macos-latest
    needs: build-test
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install gnupg
        run: brew install gnupg

      - name: Read project version
        id: version
        run: |
          VERSION=$(mvn -q -pl . help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Root pom version '$VERSION' isn't a SNAPSHOT — develop's pom.xml should always carry a -SNAPSHOT version under this workflow. Nothing to publish here."
            exit 1
          fi
          echo "Root pom version: $VERSION"

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          # --pinentry-mode loopback (in the release profile's gpg-plugin config) is ignored by
          # gpg-agent unless allow-loopback-pinentry is set here; without it, the agent tries to
          # launch a pinentry program and fails headless ("gpg: signing failed: No pinentry").
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          DECODED=$(echo "$GPG_PRIVATE_KEY_B64" | base64 -d)
          # ::add-mask:: only masks a single line -- mask every line of the multi-line
          # armor block individually, or everything after the first line prints in plain
          # text the moment it appears in any later log output.
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$DECODED"
          echo "$DECODED" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          # The release profile's maven-gpg-plugin config reads <homedir>${env.GPG_HOMEDIR}</homedir>,
          # not GNUPGHOME (the gpg CLI's own var) -- both must point at the same imported keyring.
          echo "GPG_HOMEDIR=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Configure Maven settings.xml (Central Portal credentials)
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          if [ -z "$CENTRAL_PORTAL_USERNAME" ] || [ -z "$CENTRAL_PORTAL_PASSWORD" ]; then
            echo "::error::CENTRAL_PORTAL_USERNAME/CENTRAL_PORTAL_PASSWORD secrets are not set."
            exit 1
          fi
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_PORTAL_USERNAME}</username>
                <password>${CENTRAL_PORTAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Check runner resources (memory/CPU theory check)
        run: |
          echo "=== CPU ==="
          sysctl -n hw.ncpu
          echo "=== MEMORY (total) ==="
          sysctl -n hw.memsize | awk '{printf "%.2f GB\n", $1/1024/1024/1024}'
          echo "=== MEMORY (live pressure) ==="
          vm_stat
          echo "=== free vs used (approx, via vm_stat page counts) ==="
          top -l 1 -n 0 | grep "PhysMem"

      - name: Deploy SNAPSHOT (cfc-core + cloudforge-core + cloudforge-api)
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # No re-test: build-test already ran the suite with -Pci and gates this job. -DskipTests
        # is explicit so this step does not depend on the pom's skipTests default.
        run: mvn -B -Prelease -pl .,cloudforge-core,cloudforge-api -am clean deploy -DskipTests "-Dgpg.passphrase=$MAVEN_GPG_PASSPHRASE"

      - name: Clean up credentials
        if: always()
        run: |
          rm -f ~/.m2/settings.xml
          rm -rf "${GNUPGHOME:-$RUNNER_TEMP/gnupg}"
