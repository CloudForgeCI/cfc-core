name: Publish Snapshot & Auto-Release

# Continuous delivery for cfc-core's OSS deployment library (cfc-core's own root/BOM pom,
# cloudforge-core, cloudforge-api, cloudforge-localstack, cloudforge-ministack). The pom.xml
# always carries a -SNAPSHOT version.
#
# cloudforge-synth-service moved out to its own repo (CloudForgeCI/cloudforge-synth-service) and
# is no longer published from here — see publish-maven-central.yml's own header comment for why.
#
#   1. build-test       — full build + test. Nothing downstream runs unless this passes.
#   2. publish-snapshot — deploys the current -SNAPSHOT version to Central Portal's snapshots
#      repository (https://central.sonatype.com/repository/maven-snapshots/), so
#      cloudforge-manager-deployment/cloudforge-manager can immediately resolve it in their own
#      CI. Tied to a pull request being open against develop (opened/updated), not to merging —
#      requesting review is what should make a snapshot available downstream, not waiting for the
#      merge itself.
#   3. release          — develop only, i.e. only once a PR actually merges (a push, not a pull
#      request event). Strips "-SNAPSHOT" from whatever version this commit already carries,
#      builds/signs/publishes that as a real numbered release to Maven Central (no re-test —
#      build-test already validated this exact code), tags vX.Y.Z, and stops. Never writes to any
#      pom.xml, never commits, never bumps anything — the version it releases is exactly whatever
#      bump-develop (below) most recently landed, nothing more.
#   4. bump-develop     — develop only, runs independently of and in parallel with release (they
#      share no ordering dependency: release publishes THIS commit's current version, bump-develop
#      advances develop to the NEXT one — unrelated operations that happen to fire off the same
#      push). Bumps develop's pom to the next patch -SNAPSHOT and pushes that commit with
#      "[skip ci]" so it doesn't re-trigger this workflow. No GPG, no Central, no macOS runner —
#      pure version bookkeeping, so a lost push-race here (see its own "Bump develop" step comment)
#      is a cheap, side-effect-free re-run, not entangled with a real publish the way it used to be
#      when both lived in one job.
#
# No developer-maintained versioning at all: a feature branch never touches <version> anywhere, so
# concurrent PRs never conflict with each other over it. The bump lives entirely at the merge
# point — bump-develop is the only thing that ever advances it, one merge at a time, serialized by
# git the same way any other push to develop already is. Every merge to develop is therefore both
# a snapshot AND a real Central release — deliberate, confirmed design (not a staged/manual release
# process). publish-maven-central.yml still exists as a manual workflow_dispatch-only escape hatch;
# it never fires from a push under this flow because the only commit this workflow ever pushes back
# to develop is bump-develop's own -SNAPSHOT bump.
#
# Required repo secrets (same four already configured for publish-maven-central.yml):
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE, CENTRAL_PORTAL_USERNAME, CENTRAL_PORTAL_PASSWORD

on:
  pull_request:
    branches: [ develop ] # snapshot as soon as a PR targeting develop is opened/updated
    types: [ opened, synchronize, reopened ]
    paths:
      - 'pom.xml'
      - 'cloudforge-core/**'
      - 'cloudforge-api/**'
      - 'cloudforge-localstack/**'
      - 'cloudforge-ministack/**'
      - '.github/workflows/publish-snapshot.yml'
  push:
    branches: [ develop ] # real release, on every push to develop (a PR merge, most commonly) —
                           # deliberately no path filter: the safety gate below (root pom's
                           # <version> not already tagged) is what actually decides whether a run
                           # does anything, so a path filter here only risks silently skipping a
                           # real release rather than saving any meaningful CI time.
  workflow_dispatch: {}

permissions:
  contents: write # to push the release tag and the next-snapshot bump commit

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        run: mvn -B -Pci -pl .,cloudforge-core,cloudforge-api,cloudforge-localstack,cloudforge-ministack -am clean verify

  publish-snapshot:
    name: Publish SNAPSHOT to Central
    # macOS, not any Linux variant. Every GnuPG-side variable has been ruled out at this point:
    # 3 different GnuPG builds (ubuntu-latest's system 2.4.4, ubuntu-22.04's system build, and
    # Homebrew's 2.5.21 -- a completely different major/build), 2 plugin versions, 2 different
    # keys, every homedir/pinentry/passphrase config combination, gpg1, both import methods, and
    # running inside a container (maven:3.9-eclipse-temurin-21 -- worked locally in Docker
    # Desktop's own Linux VM, still failed identically on GitHub's own runner, since containers
    # share their host's kernel rather than getting their own -- whatever's causing this lives at
    # the GitHub Linux runner kernel level, not in GnuPG, our config, or containerization).
    # macOS has never once failed, locally, all day, across every one of the above combinations.
    runs-on: macos-latest
    needs: build-test
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install gnupg
        run: brew install gnupg

      - name: Read project version
        id: version
        run: |
          VERSION=$(mvn -q -pl . help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Root pom version '$VERSION' isn't a SNAPSHOT — develop's pom.xml should always carry a -SNAPSHOT version under this workflow. Nothing to publish here."
            exit 1
          fi
          echo "Root pom version: $VERSION"

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          # --pinentry-mode loopback (in the release profile's gpg-plugin config) is silently
          # ignored by gpg-agent unless allow-loopback-pinentry is explicitly permitted here --
          # without it, the agent still tries (and fails, headless) to launch a real pinentry
          # program ("gpg: signing failed: No pinentry").
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          DECODED=$(echo "$GPG_PRIVATE_KEY_B64" | base64 -d)
          # ::add-mask:: only masks a single line -- mask every line of the multi-line
          # armor block individually, or everything after the first line prints in plain
          # text the moment it appears in any later log output.
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$DECODED"
          echo "$DECODED" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          # The release profile's maven-gpg-plugin config reads <homedir>${env.GPG_HOMEDIR}</homedir>,
          # not GNUPGHOME (the gpg CLI's own var) -- both must point at the same imported keyring.
          echo "GPG_HOMEDIR=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Configure Maven settings.xml (Central Portal credentials)
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          if [ -z "$CENTRAL_PORTAL_USERNAME" ] || [ -z "$CENTRAL_PORTAL_PASSWORD" ]; then
            echo "::error::CENTRAL_PORTAL_USERNAME/CENTRAL_PORTAL_PASSWORD secrets are not set."
            exit 1
          fi
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_PORTAL_USERNAME}</username>
                <password>${CENTRAL_PORTAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Check runner resources (memory/CPU theory check)
        run: |
          echo "=== CPU ==="
          sysctl -n hw.ncpu
          echo "=== MEMORY (total) ==="
          sysctl -n hw.memsize | awk '{printf "%.2f GB\n", $1/1024/1024/1024}'
          echo "=== MEMORY (live pressure) ==="
          vm_stat
          echo "=== free vs used (approx, via vm_stat page counts) ==="
          top -l 1 -n 0 | grep "PhysMem"

      - name: Deploy SNAPSHOT (cfc-core + cloudforge-core + cloudforge-api + cloudforge-localstack)
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # No re-test -- needs: build-test above already ran the real suite with -Pci and gates
        # whether this step runs at all; explicit here so it doesn't silently depend on the
        # skipTests=true default happening to be correct.
        run: mvn -B -Prelease -pl .,cloudforge-core,cloudforge-api,cloudforge-localstack,cloudforge-ministack -am clean deploy -DskipTests "-Dgpg.passphrase=$MAVEN_GPG_PASSPHRASE"

      - name: Clean up credentials
        if: always()
        run: |
          rm -f ~/.m2/settings.xml
          rm -rf "${GNUPGHOME:-$RUNNER_TEMP/gnupg}"

  release:
    name: Release to Maven Central
    # macOS -- see the publish-snapshot job above for why.
    runs-on: macos-latest
    needs: publish-snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    timeout-minutes: 30
    concurrency:
      group: publish-snapshot-cfc-core-release
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag history

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compute release version
        id: versions
        run: |
          SNAPSHOT_VERSION="${{ needs.publish-snapshot.outputs.version }}"
          RELEASE_VERSION="${SNAPSHOT_VERSION%-SNAPSHOT}"

          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse "v$RELEASE_VERSION" >/dev/null 2>&1; then
            # RELEASE_VERSION was derived from the SNAPSHOT this exact run just built and
            # validated, so an existing tag for it isn't a conflicting release -- it's the same
            # one, already published, most likely by a prior run of this same job (e.g. a manual
            # re-run) that already completed successfully. Central won't accept a second publish
            # of a version it's already holding, so there's nothing left for this run to do.
            echo "::warning::v$RELEASE_VERSION is already tagged -- treating this as an already-completed release. Nothing to do."
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
            echo "Releasing v$RELEASE_VERSION"
          fi

      - name: Set release version
        if: steps.versions.outputs.already_released == 'false'
        run: mvn -q -B versions:set -DnewVersion=${{ steps.versions.outputs.release_version }} -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Install gnupg
        if: steps.versions.outputs.already_released == 'false'
        run: brew install gnupg

      - name: Import GPG signing key
        if: steps.versions.outputs.already_released == 'false'
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          # --pinentry-mode loopback (in the release profile's gpg-plugin config) is silently
          # ignored by gpg-agent unless allow-loopback-pinentry is explicitly permitted here --
          # without it, the agent still tries (and fails, headless) to launch a real pinentry
          # program ("gpg: signing failed: No pinentry").
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          DECODED=$(echo "$GPG_PRIVATE_KEY_B64" | base64 -d)
          # ::add-mask:: only masks a single line -- mask every line of the multi-line
          # armor block individually, or everything after the first line prints in plain
          # text the moment it appears in any later log output.
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$DECODED"
          echo "$DECODED" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          # The release profile's maven-gpg-plugin config reads <homedir>${env.GPG_HOMEDIR}</homedir>,
          # not GNUPGHOME (the gpg CLI's own var) -- both must point at the same imported keyring.
          echo "GPG_HOMEDIR=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Configure Maven settings.xml (Central Portal credentials)
        if: steps.versions.outputs.already_released == 'false'
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_PORTAL_USERNAME}</username>
                <password>${CENTRAL_PORTAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build, sign, and publish the release (no re-test — already validated as a SNAPSHOT this run)
        if: steps.versions.outputs.already_released == 'false'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -Prelease -pl .,cloudforge-core,cloudforge-api,cloudforge-localstack,cloudforge-ministack -am clean deploy -DskipTests -Djacoco.skip=true "-Dgpg.passphrase=$MAVEN_GPG_PASSPHRASE"

      - name: Clean up credentials
        if: always()
        run: |
          rm -f ~/.m2/settings.xml
          rm -rf "${GNUPGHOME:-$RUNNER_TEMP/gnupg}"

      - name: Tag the published release
        if: steps.versions.outputs.already_released == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.versions.outputs.release_version }}" -m "Publish v${{ steps.versions.outputs.release_version }} to Maven Central (cfc-core, cloudforge-core, cloudforge-api, cloudforge-localstack, cloudforge-ministack)"
          git push origin "v${{ steps.versions.outputs.release_version }}"

      - name: Publish summary
        if: always()
        run: |
          echo "## Release to Maven Central" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Snapshot published:** ${{ needs.publish-snapshot.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.versions.outputs.already_released }}" = "true" ]; then
            echo "**Release:** v${{ steps.versions.outputs.release_version }} was already published by a prior run -- nothing to do this time." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Release published:** ${{ steps.versions.outputs.release_version }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Modules:** cfc-core (BOM), cloudforge-core, cloudforge-api, cloudforge-localstack, cloudforge-ministack" >> $GITHUB_STEP_SUMMARY

  bump-develop:
    name: Bump develop to next SNAPSHOT
    # ubuntu-latest, not macOS: this job never touches GPG/Central at all -- pure version
    # bookkeeping (mvn versions:set + a git commit/push), so it carries none of the reasons the
    # release job above needs a macOS runner. Runs independently of and in parallel with release
    # (needs: publish-snapshot only, not release) -- release publishes THIS commit's current
    # version, this job advances develop to the NEXT one; unrelated operations that happen to fire
    # off the same push, with no ordering dependency on each other.
    runs-on: ubuntu-latest
    needs: publish-snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    timeout-minutes: 10
    concurrency:
      group: publish-snapshot-cfc-core-bump-develop
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Bump develop to the next SNAPSHOT
        run: |
          SNAPSHOT_VERSION="${{ needs.publish-snapshot.outputs.version }}"
          RELEASE_VERSION="${SNAPSHOT_VERSION%-SNAPSHOT}"
          # Patch-level bump for the next in-progress version: 3.2.0 -> 3.2.1-SNAPSHOT
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASE_VERSION"
          NEXT_SNAPSHOT="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mvn -q -B versions:set -DnewVersion="$NEXT_SNAPSHOT" -DprocessAllModules=true -DgenerateBackupPoms=false
          git add -A
          git commit -m "chore: bump to $NEXT_SNAPSHOT [skip ci]"
          # Guards against a genuine race (another push landing on develop between this job's
          # checkout and its own push below) -- a plain push here would be rejected as
          # non-fast-forward. Same pattern cloudforge-manager's sync-versions.yml already uses for
          # its own bump-and-push. Isolated to this one cheap, side-effect-free operation now, not
          # entangled with a real Central publish the way it was when both lived in one job.
          git pull --rebase origin develop
          git push origin HEAD:develop
