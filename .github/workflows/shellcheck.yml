name: ShellCheck

# Lints every tracked shell script for real bug patterns (unquoted expansions, unset variable
# use, command-injection-shaped constructs) -- CodeQL doesn't cover Shell, so this is the only
# static analysis these scripts get.

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
