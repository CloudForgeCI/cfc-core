name: Security Scanning

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  schedule:
    # Run weekly security scans on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  sbom-and-vulnerability-scan:
    name: SBOM Generation & Vulnerability Scanning
    # See codeql-analysis.yml's analyze job for why dependabot PRs route to the self-hosted runner.
    runs-on: ${{ github.actor == 'dependabot[bot]' && fromJSON('["self-hosted", "mac-mini"]') || 'ubuntu-latest' }}
    # Was unset (GitHub's 360-minute default) -- with the NVD sync step itself now capped at
    # 90 minutes and saved immediately after, nothing else in this job should legitimately run
    # anywhere near that long.
    timeout-minutes: 120

    permissions:
      contents: write  # Required for SBOM submission to dependency graph
      security-events: write
      actions: read
      id-token: write  # Required for SBOM submission

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Get current date for cache key
        id: date
        run: echo "date=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Restore OWASP Dependency-Check NVD database
        id: nvd-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/dependency-check-data
          # Cache key based on year-week (YYYY-WW) -- rotates weekly so each week's run saves a
          # fresh snapshot, but restore-keys falls back to the most recent prior week whenever
          # this week's exact key doesn't exist yet, so the NVD client only ever needs to apply
          # an incremental update on top of it, never a full rebuild from nothing.
          key: ${{ runner.os }}-dependency-check-v12-${{ steps.date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-v12-

      - name: Build project and generate SBOM
        run: |
          echo "Building project and generating SBOM..."
          # Build modules + parent POM (for aggregate SBOM)
          mvn clean install -DskipTests -pl .,cloudforge-api,cloudforge-core || mvn clean install -DskipTests
          echo "Build and SBOM generation complete"

      - name: Configure OSS Index credentials
        env:
          OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
          OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>ossindex</id>
                <username>${OSSINDEX_USERNAME}</username>
                <password>${OSSINDEX_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Initialize NVD Database (filtered for CVSS v3.x only)
        # Bounded well below the job's own timeout, and non-fatal: a cold cache (first run under
        # a new weekly key, or a bad NVD API day) can genuinely take a very long time to fully
        # sync. Letting it run unbounded is what caused every run to blow the default 360-minute
        # job timeout -- that kills the job before the cache-save step below ever runs, so the
        # NVD data downloaded was never persisted and the next run started cold again too,
        # forever. Capping this step and always saving whatever progress it made (even partial)
        # breaks that cycle: each run's incremental progress compounds instead of being discarded.
        timeout-minutes: 90
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          echo "Checking NVD database cache status..."
          if [ -n "$NVD_API_KEY" ]; then
            echo "Using NVD API key for faster updates"
          else
            echo "Warning: No NVD API key - updates will be slower"
          fi

          # Check if cache exists and is valid
          if [ -d ~/.m2/dependency-check-data ] && [ "$(ls -A ~/.m2/dependency-check-data)" ]; then
            echo "Found existing NVD cache - will use incremental updates"
          else
            echo "No cache found - will perform initial download"
          fi

          # Run a lightweight check to update the database
          # Use check goal with high CVSS threshold so it doesn't fail on vulnerabilities
          # The date filters in pom.xml will apply here (2020-2024 to avoid CVSS v4.0 bugs)
          echo "Updating NVD database..."
          mvn dependency-check:update-only -Psecurity-scan || {
            echo "Warning: NVD update failed, but continuing with available data"
          }

      - name: Save OWASP Dependency-Check NVD database
        # Runs regardless of whether the update step above finished, failed, or timed out --
        # see that step's comment. dependency-check writes to its local DB incrementally as it
        # processes NVD API pages, so even a partial/interrupted sync is real progress worth
        # keeping for next run's restore-keys fallback to build on.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/dependency-check-data
          key: ${{ steps.nvd-cache-restore.outputs.cache-primary-key }}

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
          OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}
        run: |
          echo "Running OWASP Dependency-Check..."
          echo "Using NVD (filtered 2020-2024 to avoid CVSS v4.0 bugs) + OSS Index for vulnerability data"
          cd ${{ github.workspace }}
          mvn dependency-check:check -Psecurity-scan || true
          echo "Dependency check complete"

          # Clean up credentials file (extra safety, runner is ephemeral anyway)
          rm -f ~/.m2/settings.xml

      - name: List generated SBOM files
        if: always()
        run: |
          echo "Searching for SBOM files..."
          find . -name "*bom*.json" -o -name "*bom*.xml" | while read file; do
            echo "Found: $file"
            ls -lh "$file"
          done

      - name: Submit dependencies to GitHub
        if: github.event_name != 'pull_request'
        run: |
          echo "Submitting dependencies to GitHub Dependency Graph..."
          # GitHub's dependency submission API requires the snapshot to be in a specific format
          # For now, we'll rely on Dependabot and the uploaded SBOM artifacts
          # The SBOM files are available as artifacts for manual review
          echo "SBOM files generated and will be uploaded as artifacts"

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            target/cfc-core-sbom.json
            target/cfc-core-sbom.xml
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
            target/dependency-check-report.xml
            target/dependency-check-report.sarif
          retention-days: 90

      - name: Upload Dependency-Check SARIF to GitHub Security
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/dependency-check-report.sarif
          category: dependency-check

      # Grype scan disabled due to frequent hangs/timeouts
      # Using OWASP Dependency-Check + OSS Index instead
      # - name: Scan SBOM with Grype (Optional)
      #   if: always()
      #   continue-on-error: true
      #   timeout-minutes: 10
      #   uses: anchore/scan-action@v3
      #   id: grype-scan
      #   with:
      #     sbom: "target/cfc-core-sbom.json"
      #     fail-build: false
      #     severity-cutoff: high

      # - name: Upload Grype SARIF report
      #   if: always() && steps.grype-scan.outputs.sarif
      #   continue-on-error: true
      #   uses: github/codeql-action/upload-sarif@v2
      #   with:
      #     sarif_file: ${{ steps.grype-scan.outputs.sarif }}

      - name: Check for High/Critical vulnerabilities
        if: always()
        run: |
          echo "Analyzing vulnerability scan results..."

          # Check OWASP Dependency-Check results (primary scanner)
          if [ -f target/dependency-check-report.json ]; then
            HIGH_COUNT=$(jq '[.dependencies[].vulnerabilities[] | select(.severity == "HIGH")] | length' target/dependency-check-report.json 2>/dev/null || echo "0")
            CRITICAL_COUNT=$(jq '[.dependencies[].vulnerabilities[] | select(.severity == "CRITICAL")] | length' target/dependency-check-report.json 2>/dev/null || echo "0")
            echo "OWASP Dependency-Check found: $CRITICAL_COUNT critical, $HIGH_COUNT high"

            if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
              echo "::warning::Found $CRITICAL_COUNT critical and $HIGH_COUNT high severity vulnerabilities"
              echo "Review the dependency-check-report.html artifact for details"
            fi
          else
            echo "OWASP Dependency-Check report not found"
          fi

          echo "Vulnerability scanning complete using OWASP Dependency-Check + OSS Index"

      - name: Generate Security Summary
        if: always()
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # SBOM Information
          echo "### Software Bill of Materials (SBOM)" >> $GITHUB_STEP_SUMMARY
          if [ -f target/cfc-core-sbom.json ]; then
            COMPONENT_COUNT=$(jq '.components | length' target/cfc-core-sbom.json)
            echo "- **Total Components:** $COMPONENT_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **SBOM Format:** CycloneDX 1.5" >> $GITHUB_STEP_SUMMARY
            echo "- **SBOM Generated:** Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **SBOM Generated:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Vulnerability Scan Results
          echo "### Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ -f target/dependency-check-report.json ]; then
            CRITICAL_COUNT=$(jq '[.dependencies[].vulnerabilities[] | select(.severity == "CRITICAL")] | length' target/dependency-check-report.json 2>/dev/null || echo "0")
            HIGH_COUNT=$(jq '[.dependencies[].vulnerabilities[] | select(.severity == "HIGH")] | length' target/dependency-check-report.json 2>/dev/null || echo "0")
            MEDIUM_COUNT=$(jq '[.dependencies[].vulnerabilities[] | select(.severity == "MEDIUM")] | length' target/dependency-check-report.json 2>/dev/null || echo "0")
            LOW_COUNT=$(jq '[.dependencies[].vulnerabilities[] | select(.severity == "LOW")] | length' target/dependency-check-report.json 2>/dev/null || echo "0")

            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical | $CRITICAL_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| High | $HIGH_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| Medium | $MEDIUM_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| Low | $LOW_COUNT |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Vulnerability report not generated" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Artifacts
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM reports available in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency-Check reports available in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Vulnerability Scanners Used" >> $GITHUB_STEP_SUMMARY
          echo "- OWASP Dependency-Check (NVD 2020-2024 + OSS Index)" >> $GITHUB_STEP_SUMMARY
          echo "- CodeQL (code scanning)" >> $GITHUB_STEP_SUMMARY

  code-quality:
    name: Code Quality & Linting
    # See codeql-analysis.yml's analyze job for why dependabot PRs route to the self-hosted runner.
    runs-on: ${{ github.actor == 'dependabot[bot]' && fromJSON('["self-hosted", "mac-mini"]') || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with coverage
        run: |
          echo "Running tests with coverage..."
          mvn clean verify -Pci
          echo "Tests complete"

      - name: List generated coverage reports
        if: always()
        run: |
          echo "Searching for JaCoCo reports..."
          find . -name "jacoco.exec" -o -path "*/site/jacoco/index.html" | while read file; do
            echo "Found: $file"
          done
          echo ""
          echo "Module coverage report locations:"
          ls -la cloudforge-api/target/site/jacoco/ 2>/dev/null || echo "cloudforge-api: No report found"
          ls -la cloudforge-core/target/site/jacoco/ 2>/dev/null || echo "cloudforge-core: No report found"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            cloudforge-api/target/site/jacoco/
            cloudforge-core/target/site/jacoco/
            cloudforge-api/target/jacoco.exec
            cloudforge-core/target/jacoco.exec
          retention-days: 30
          if-no-files-found: warn
