version: 2
updates:
  # The Maven reactor (cfc-core, cloudforge-core, cloudforge-api) at the repo root.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # docs/web (Docusaurus) — not a Maven module, has its own package-lock.json.
  - package-ecosystem: "npm"
    directory: "/docs/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # GitHub Actions used across this repo's workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # A standalone example project, not a reactor module (no <parent>, own <dependencyManagement>
  # pinning cfc-core's BOM plus aws-cdk-lib/constructs directly) -- the root maven entry above
  # doesn't reach it.
  - package-ecosystem: "maven"
    directory: "/docs/examples/cloudforge-sample"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
