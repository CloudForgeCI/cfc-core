global
    log stdout local0
    log stdout local1 notice
    maxconn 4096

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
    hold other 30s
    hold refused 30s
    hold nx 30s
    hold timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000
    option forwardfor except 127.0.0.0/8
    option http-server-close

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-legends
    stats admin if TRUE

frontend web_frontend
    bind *:80
    # SSL termination is handled by AWS ALB in production.
    # For local dev, run HTTP only. To enable HTTPS locally:
    #   openssl req -x509 -newkey rsa:4096 -nodes -keyout key.pem -out cert.pem -days 365 -subj '/CN=localhost'
    #   cat cert.pem key.pem > docker/haproxy/certs/self-signed.pem
    #   Then uncomment: bind *:443 ssl crt /etc/ssl/certs/self-signed.pem
    mode http
    option httplog
    option forwardfor

    # ACL definitions for each service
    acl jenkins_path path_beg /jenkins
    acl gitlab_path path_beg /gitlab
    acl gitea_path path_beg /gitea
    acl grafana_path hdr(host) -i grafana.local
    acl prometheus_path hdr(host) -i prometheus.local
    acl metabase_path hdr(host) -i metabase.local
    acl superset_path hdr(host) -i superset.local
    acl mattermost_path hdr(host) -i mattermost.local
    acl nexus_path hdr(host) -i nexus.local
    acl vault_path hdr(host) -i vault.local

    # Hostname-based routing
    use_backend jenkins_backend if jenkins_path
    use_backend gitlab_backend if gitlab_path
    use_backend gitea_backend if gitea_path
    use_backend grafana_backend if grafana_path
    use_backend prometheus_backend if prometheus_path
    use_backend metabase_backend if metabase_path
    use_backend superset_backend if superset_path
    use_backend mattermost_backend if mattermost_path
    use_backend nexus_backend if nexus_path
    use_backend vault_backend if vault_path

    # Default backend
    default_backend default_backend

# Service backends
backend jenkins_backend
    server jenkins jenkins:8080 check resolvers docker init-addr libc,none maxconn 32

backend gitlab_backend
    server gitlab gitlab:80 check resolvers docker init-addr libc,none maxconn 32

backend gitea_backend
    server gitea gitea:3000 check resolvers docker init-addr libc,none maxconn 32

backend grafana_backend
    server grafana grafana:3000 check resolvers docker init-addr libc,none maxconn 32

backend prometheus_backend
    server prometheus prometheus:9090 check resolvers docker init-addr libc,none maxconn 32

backend metabase_backend
    server metabase metabase:3000 check resolvers docker init-addr libc,none maxconn 32

backend superset_backend
    server superset superset:8088 check resolvers docker init-addr libc,none maxconn 32

backend mattermost_backend
    server mattermost mattermost:8065 check resolvers docker init-addr libc,none maxconn 32

backend nexus_backend
    server nexus nexus:8081 check resolvers docker init-addr libc,none maxconn 32

backend vault_backend
    server vault vault:8200 check resolvers docker init-addr libc,none maxconn 32

backend default_backend
    server jenkins jenkins:8080 check resolvers docker init-addr libc,none maxconn 32
