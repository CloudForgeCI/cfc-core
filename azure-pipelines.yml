# Publishes cloudforge-core/cloudforge-api to the cfc-core Azure Artifacts feed, so
# cloudforge-manager's ADO pipeline can resolve them without hitting Maven Central snapshots
# directly. cloudforge-localstack/cloudforge-ministack are no longer built here -- they live in
# their own GitHub repos and publish to Central directly; cloudforge-manager's ADO pipeline needs
# to resolve those two from Central snapshots instead of this feed.
#
# cloudforge-synth-service is not published here; cloudforge-manager's ADO build checks out
# CloudForgeCI/cloudforge-synth-service as a sibling and `mvn install`s it locally.
#
# Separate from .github/workflows/publish-snapshot.yml, which remains the publish-of-record to
# Maven Central. -DaltDeploymentRepository below redirects only this pipeline's deploy; no
# pom.xml/distributionManagement change is involved.
#
# No GPG signing here (unlike publish-snapshot.yml's release job): Azure Artifacts feeds don't
# require it, and this build does not activate the release profile.
#
# Triggers on pushes to develop, independently of the GitHub release pipeline. `pr: none` is
# required for a public repo: it prevents a fork's PR from running pipeline-authored code with the
# feed's injected Maven credentials. Push-only triggers are safe because changes reach develop
# only through a reviewed merge.
trigger:
  branches:
    include:
      - develop
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  FEED_URL: 'https://pkgs.dev.azure.com/CloudForgeCI/cloudforge-manager/_packaging/cfc-core/maven/v1'
  MODULES: '.,cloudforge-core,cloudforge-api'

steps:
  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '25'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  # artifactsFeeds (not mavenServiceConnections) since cfc-core is a feed in this same ADO
  # organization -- no separate Maven-type service connection needed. Injects credentials into a
  # generated settings.xml with a <server> id matching the feed name, which -DaltDeploymentRepository
  # below references directly.
  - task: MavenAuthenticate@0
    inputs:
      artifactsFeeds: 'cfc-core'

  - script: |
      mvn -B -pl $(MODULES) -am clean deploy \
        -DskipTests -Djacoco.skip=true \
        -DaltDeploymentRepository=cfc-core::default::$(FEED_URL)
    displayName: 'Build and publish to the cfc-core Artifacts feed'
